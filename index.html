/* ---------- Demo ---------- */
const DEMO={seed:8,p0:0.28,p1:0.04,w0:0.4,w1:1.6,l0:0.7,l1:0.4};
function genDemo(acc,st){
  const rnd=mulberry32(DEMO.seed);const out=[];
  const days=[];const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-1);
  while(days.length<17){const wd=d.getDay();if(wd>0&&wd<6)days.unshift(d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()));d.setDate(d.getDate()-1);}
  const syms=[['MNQ',21450,0.25],['MNQ',21450,0.25],['MNQ',21450,0.25],['MES',6010,0.25],['MES',6010,0.25],['NQ',21450,0.25],['MGC',2660,0.1]];
  const pick=(a,n)=>{const c=a.slice();const r=[];while(r.length<n&&c.length)r.push(c.splice(Math.floor(rnd()*c.length),1)[0]);return r;};
  const confl=(st.confluences&&st.confluences.length)?st.confluences:CONF_DEFAULT;const setups=(st.setups&&st.setups.length)?st.setups:SETUP_DEFAULT;
  let created=Date.now()-1e8;
  days.forEach(ds=>{
    const n=rnd()<0.15?0:1+Math.floor(rnd()*3);
    const sr=rnd();let tmin=sr<0.42?9*60+Math.floor(rnd()*40):sr<0.7?15*60+30+Math.floor(rnd()*20):sr<0.86?23*60+Math.floor(rnd()*40):2*60+Math.floor(rnd()*60);let prevLoss=false;const asia=sr>=0.7;
    for(let k=0;k<n;k++){
      const [sym,base,tick]=syms[Math.floor(rnd()*syms.length)];const pv=INSTR[sym].pv;
      const contracts=sym==='NQ'?1:sym==='MGC'?2:(rnd()<0.5?3:4);
      const stopPts=Math.max(tick*4,Math.round((90+rnd()*60)/(pv*contracts)/tick)*tick);
      const dir=rnd()<0.55?1:-1;const rt=v=>round2(Math.round(v/tick)*tick);
      const entry=rt(base*(1+(rnd()-0.5)*0.02));
      const stab=clamp(Math.round(5+rnd()*5-(prevLoss?2.5:0)-rnd()*2),1,10);
      const win=rnd()<DEMO.p0+(stab-1)*DEMO.p1+(asia?0.08:0);
      const rMul=win?DEMO.w0+rnd()*DEMO.w1:-(DEMO.l0+rnd()*DEMO.l1);
      const hold=4+Math.floor(rnd()*28);const plan=stab>=6?rnd()<0.85:rnd()<0.4;
      const per=INSTR[sym].mini===1?+((st.commissions&&st.commissions.mini)||0):+((st.commissions&&st.commissions.micro)||0);
      out.push({id:'demo'+out.length,accountId:acc.id,date:ds,entryTime:hm(tmin),exitTime:hm(tmin+hold),instrument:sym,dir,contracts,
        entry,stop:rt(entry-dir*stopPts),target:rt(entry+dir*stopPts*(1.5+Math.floor(rnd()*3)*0.5)),exits:[{price:rt(entry+dir*rMul*stopPts),qty:contracts}],
        commission:round2(contracts*per),setup:setups[Math.floor(rnd()*setups.length)],
        grade:stab>=8?(rnd()<0.5?'A+':'A'):stab>=5?(rnd()<0.6?'A':'B'):(rnd()<0.5?'B':'C'),
        confluences:pick(confl,1+Math.floor(rnd()*4)+(stab>=7?1:0)),regime:REGIMES[Math.floor(rnd()*3)],
        stabBefore:stab,stabAfter:clamp(stab+(win?Math.round(rnd()*2):-1-Math.round(rnd()*2)),1,10),
        emotions:win?pick(['ruhig','fokussiert'],1+Math.floor(rnd()*2)):pick(stab<5?['Frust','Ungeduld','Revenge','FOMO']:['Angst','Ungeduld','ruhig'],1),
        planFollowed:plan,rateEntry:plan?'gut':(rnd()<0.5?'neutral':'schlecht'),rateMgmt:rnd()<0.6?'gut':'neutral',
        rateExit:win?(rnd()<0.6?'gut':'neutral'):(rnd()<0.5?'neutral':'schlecht'),
        errors:(!plan&&!win)?pick(ERRORS,1):[],mae:null,mfe:null,screenshot:null,notes:'',createdAt:created++,
        slReason:SL_REASONS[Math.floor(rnd()*4)],reaction:win?(rnd()<0.65?'stark':'schwach'):(rnd()<0.5?'durchgebrochen':rnd()<0.5?'keine':'schwach'),
        beMoved:rnd()<0.45,beTime:null,exitReason:win?(rnd()<0.7?'Target':'Manuell'):'Stop Loss'});
      {const tt=out[out.length-1];if(tt.beMoved){tt.beTime=hm(tmin+Math.min(hold-1,2+Math.floor(rnd()*8)));if(!win&&rnd()<0.6){tt.exits=[{price:tt.entry,qty:contracts}];tt.exitReason='Break-even';}}}
      prevLoss=!win;tmin+=hold+15+Math.floor(rnd()*40);
    }
  });
  return out;
}

  if(F.dirty&&!F.discardArm){F.discardArm=true;const b=$('[data-act="cancelSheet"]',sheet);if(b)b.textContent='Verwerfen?';const e=$('#sheetErr');if(e)e.textContent='Ungespeicherte Änderungen. Nochmal tippen zum Verwerfen.';return;}
  closeSheet(false);
}
$('#toast').addEventListener('click',e=>{if(!e.target.closest('.toast-act')||!toastState)return;const o=toastState;toastState=null;clearTimeout(toast._t);$('#toast').classList.remove('on','has-act');if(o.fn)o.fn();});
sheet.addEventListener('click',e=>{
  if(!F)return;
  if(e.target===sheet){requestClose();return;}
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.seg){const key=b.dataset.seg;const raw=b.dataset.v;
    let val=key==='dir'||key==='stabBefore'||key==='stabAfter'?Number(raw):(key==='planFollowed'||key==='beMoved')?raw==='ja':raw;
    const same=(key==='planFollowed'||key==='beMoved')?(F[key]===val):String(F[key])===String(val);
    if(OPTIONAL_SEG.has(key)&&same)val=null;F[key]=val;F.dirty=true;
    $$(`[data-seg="${key}"]`,sheet).forEach(x=>x.setAttribute('aria-pressed',String(segOn(key,F[key],x.dataset.v))));
    if(key==='instrument'){autoComm(true);}
    updateLive();return;}
  if(b.dataset.chip){const key=b.dataset.chip,v=b.dataset.v;const arr=F[key];const i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else arr.push(v);F.dirty=true;
    b.setAttribute('aria-pressed',String(i<0));if(key==='confluences'){const l=$('#confLabel',sheet);if(l)l.textContent=`Confluences (${arr.length})`;}return;}
  switch(b.dataset.act){
    case 'addExit':F.dirty=true;F.exitQtyManual=true;F.exits.push({price:'',qty:''});$('#exits',sheet).innerHTML=exitsHTML();updateLive();{const ins=$$('[data-exk="price"]',sheet);ins[ins.length-1].focus();}break;
    case 'rmExit':F.dirty=true;F.exits.splice(+b.dataset.i,1);$('#exits',sheet).innerHTML=exitsHTML();updateLive();break;
    case 'tradeAi':runTradeAi();break;
    case 'attachRec':attachRec();break;
    case 'recDownload':recDownload();break;
    case 'rmVideo':F.dirty=true;if(F.video&&F.video!==F.oldVideo&&S.assets)S.assets.delete(F.video).catch(()=>{});F.video=null;F.vMsg='';renderVid();break;
    case 'pickShot':$('#shotFile',sheet).click();break;
    case 'rmShot':F.dirty=true;if(F.screenshot&&F.screenshot!==F.oldShot&&S.assets)S.assets.delete(F.screenshot).catch(()=>{});F.screenshot=null;F.shotMsg='';renderShot();break;
    case 'cancelSheet':requestClose();break;
    case 'copyTrade':{
      if(F.dirty&&!F.copyArm){F.copyArm=true;b.textContent='Ohne Speichern kopieren?';return;}
      const tpl={instrument:F.instrument,dir:F.dir,contracts:F.contracts,setup:F.setup,grade:F.grade,confluences:[...F.confluences],regime:F.regime,slReason:F.slReason};
      closeSheet(false);openSheet(null,tpl);toast('Kopie angelegt. Trag Zeiten und Preise neu ein.');break;}
    case 'saveSheet':saveSheet();break;
    case 'delTrade':
      {const id=F.id,shot=F.oldShot,vid=F.oldVideo;if(F.screenshot&&F.screenshot!==F.oldShot&&S.assets)S.assets.delete(F.screenshot).catch(()=>{});
        if(F.video&&F.video!==F.oldVideo&&S.assets)S.assets.delete(F.video).catch(()=>{});F.video=F.oldVideo;
        const orig=allTrades().find(x=>x.id===id);const copy=orig?clone(orig):null;
        F.screenshot=F.oldShot;closeSheet(true);deleteTrade(id);
        toast('Trade gelöscht.',{label:'Rückgängig',fn:()=>{if(copy){persistTrade(copy);toast('Trade wiederhergestellt.');}},
          onExpire:()=>{if(S.assets&&!S.demo){if(shot)S.assets.delete(shot).catch(()=>{});if(vid)S.assets.delete(vid).catch(()=>{});}}});}
      break;
  }
});
sheet.addEventListener('input',e=>{
  if(!F)return;const el=e.target;
  if(el.dataset.f){F[el.dataset.f]=el.value;F.dirty=true;
    if(el.dataset.f==='commission')F.commManual=true;
    if(el.dataset.f==='contracts'){syncSingleExit();autoComm(true);}
    updateLive();return;}
  if(el.dataset.ex!=null){const i=+el.dataset.ex;F.exits[i][el.dataset.exk]=el.value;F.dirty=true;if(el.dataset.exk==='qty')F.exitQtyManual=true;updateLive();}

sheet.addEventListener('change',e=>{
  if(!F)return;const el=e.target;

  if(el.id==='shotFile'){const f=el.files&&el.files[0];el.value='';if(f)uploadShot(f);}

sheet.addEventListener('paste',e=>{
  if(!F||!S.assets||S.demo)return;const items=(e.clipboardData&&e.clipboardData.items)||[];
  for(const it of items){if(it.kind==='file'&&it.type.startsWith('image/')){const f=it.getAsFile();if(f){e.preventDefault();uploadShot(f);}break;}}

/* ---------- Start ---------- */
function dbMsg(err){const c=err&&err.code;return c==='revoked'?'Der Zugriff auf dieses Journal wurde beendet.':c==='resource_exhausted'?'Zu viele Anfragen. Lade die Seite in einer Minute neu.':'Dein Journal ist hier gerade nicht verfügbar.';}
function subscribe(){
  const base='data/users/'+S.uid;let okS=false,okT=false;
  const timer=setTimeout(()=>{if(!(okS&&okT)){S.slow=true;render();}},10000);
  const done=()=>{if(okS&&okT){clearTimeout(timer);if(S.slow){S.slow=false;}}};
  S.db.doc(base+'/settings').onSnapshot(snap=>{
    if(snap.exists){S.real.settings=clone(snap.data());S.real.settingsLoaded=true;}
    else if(!snap.metadata.fromCache){S.real.settings=null;S.real.settingsLoaded=true;}
    if(!snap.metadata.fromCache){okS=true;done();}
    render({bg:true});
  },err=>{okS=true;done();S.dbError=dbMsg(err);S.real.settingsLoaded=true;render();});
  tradesCol().onSnapshot(qs=>{
    S.real.trades=qs.docs.filter(d=>d.exists).map(d=>clone(d.data()));
    if(!qs.metadata.fromCache){okT=true;done();}
    render({bg:true});
  },err=>{okT=true;done();S.dbError=dbMsg(err);render();});
}
/* ---------- Supabase-Anbindung (eigenständige Version) ---------- */
let SB=null;
function getCfg(){const c=lsGet('tj.sbcfg');return c&&c.url&&c.key?c:null;}
function sbErr(e){const m=String((e&&(e.message||e.error_description||e.msg))||e||'');
  if(/Invalid login|invalid_credentials/i.test(m))return 'E-Mail oder Passwort stimmt nicht.';
  if(/Email not confirmed/i.test(m))return 'Die E-Mail ist noch nicht bestätigt. Setz in Supabase bei deinem Nutzer „Auto Confirm“ oder bestätige die E-Mail.';
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))return 'Supabase ist nicht erreichbar. Prüf die Project-URL und deine Internetverbindung.';
  if(/Invalid API key|No API key/i.test(m))return 'Der Anon Key passt nicht zu diesem Projekt.';
  return m||'Unbekannter Fehler.';}
function sbAdapter(sb,uid){
  const L={s:[],t:[]};
  const snap=d=>({exists:d!=null,data:()=>d,metadata:{fromCache:false}});
  const fetchSettings=async()=>{const {data,error}=await sb.from('journal_settings').select('data').eq('user_id',uid).maybeSingle();if(error)throw error;return data?data.data:null;};
  const fetchTrades=async()=>{let all=[],from=0;for(;;){const {data,error}=await sb.from('trades').select('data').eq('user_id',uid).range(from,from+999);if(error)throw error;all=all.concat(data.map(r=>r.data));if(data.length<1000)break;from+=1000;}return all;};
  const db={doc(path){
    if(path.endsWith('/settings'))return {
      set:async b=>{const {error}=await sb.from('journal_settings').upsert({user_id:uid,data:b,updated_at:new Date().toISOString()});if(error)throw error;},
      onSnapshot(next,err){const f=()=>fetchSettings().then(d=>next(snap(d))).catch(e=>err&&err(e));L.s.push(f);f();return()=>{};}};
    if(path.endsWith('/coach'))return {
      get:async()=>{const {data,error}=await sb.from('coach_reports').select('data').eq('user_id',uid).order('created_at',{ascending:false}).limit(1).maybeSingle();if(error)throw error;return snap(data?data.data:null);},
      set:async b=>{const {error}=await sb.from('coach_reports').insert({user_id:uid,data:b});if(error)throw error;}};
    return {collection(){return {
      doc(id){return {
        set:async b=>{const {error}=await sb.from('trades').upsert({id,user_id:uid,account_id:b.accountId,trade_date:b.date,data:b,updated_at:new Date().toISOString()});if(error)throw error;},
        delete:async()=>{const {error}=await sb.from('trades').delete().eq('id',id).eq('user_id',uid);if(error)throw error;}};},
      onSnapshot(next,err){const f=()=>fetchTrades().then(rows=>next({docs:rows.map(r=>({exists:true,data:()=>r})),metadata:{fromCache:false}})).catch(e=>err&&err(e));L.t.push(f);f();return()=>{};}};}};
  }};
  db.refresh=()=>{L.s.forEach(f=>f());L.t.forEach(f=>f());};
  return db;
}
function sbAssets(sb,uid){return {
  upload:async(file,o)=>{const type=(o&&o.type)||file.type||'application/octet-stream';const ext=(type.split('/')[1]||'bin').split(';')[0].replace('quicktime','mov');
    const id=uid+'/'+(crypto.randomUUID?crypto.randomUUID():newId('m'))+'.'+ext;
    const {error}=await sb.storage.from('trade-media').upload(id,file,{contentType:type.split(';')[0],upsert:false});
    if(error){const m=String(error.message||'');throw {code:/maximum|too large|413/i.test(m+error.statusCode)?'too_large':'upload_failed',message:m};}
    return {id};},
  delete:async id=>{await sb.storage.from('trade-media').remove([id]);}};}
const mediaCache=new Map();
async function mediaUrl(id){
  if(!SB||!id||!String(id).includes('/'))return null;
  const c=mediaCache.get(id);if(c&&c.exp>Date.now())return c.url;
  const {data,error}=await SB.storage.from('trade-media').createSignedUrl(id,3600);if(error)return null;
  mediaCache.set(id,{url:data.signedUrl,exp:Date.now()+50*60*1000});return data.signedUrl;}
function hydrateMedia(root){$$('[data-media]',root||document).forEach(el=>{const id=el.dataset.media;el.removeAttribute('data-media');
  mediaUrl(id).then(u=>{if(u)el.src=u;else el.replaceWith(Object.assign(document.createElement('p'),{className:'hint',textContent:'Datei nicht verfügbar.'}));});});}
function sbSample(sb){return async(input,opts)=>{
  const messages=typeof input==='string'?[{role:'user',content:input}]:input;
  let res;try{res=await sb.functions.invoke('coach',{body:{messages,tier:opts&&opts.modelTier}});}catch(e){throw {code:'not_setup'};}
  const {data,error}=res;
  if(error){const st=error.context&&error.context.status;let msg='';try{const j=await error.context.json();msg=j&&j.error;}catch(_){}
    if(st===404||/not found/i.test(String(error.message)))throw {code:'not_setup'};
    if(msg==='no_key')throw {code:'no_key'};
    if(st===429)throw {code:'rate_limited'};
    throw {code:'failed',message:msg||error.message};}
  const text=(data&&data.text)||'';if(opts&&opts.onText)opts.onText({text,delta:text});return {text,truncated:false};};}

  const f=$('input',g);if(f)setTimeout(()=>f.focus(),30);

function hideGate(){$('#gate').hidden=true;$('#gate').innerHTML='';$('.app').hidden=false;}
document.addEventListener('submit',async e=>{
  if(e.target.id==='cfgForm'){e.preventDefault();
    let url=$('#cfgUrl').value.trim().replace(/\/+$/,'');const key=$('#cfgKey').value.trim();const er=$('#gateErr');
    if(url&&!/^https?:\/\//.test(url))url='https://'+url;
    if(!/^https:\/\/[^/]+$/.test(url)){er.textContent='Trag die Project URL ein, zum Beispiel https://abcdefgh.supabase.co.';return;}
    if(key.length<20){er.textContent='Trag den Anon Key ein.';return;}
    if(/service_role/.test(key)||(()=>{try{return JSON.parse(atob(key.split('.')[1])).role==='service_role';}catch(_){return false;}})()){er.textContent='Das ist der service_role-Key. Nimm den anon (public) Key.';return;}
    lsSet('tj.sbcfg',{url,key});er.textContent='';startSupabase();}
  if(e.target.id==='loginForm'){e.preventDefault();const er=$('#gateErr');const btn=$('button[type=submit]',e.target);
    const email=$('#lgMail').value.trim(),pw=$('#lgPw').value;if(!email||!pw){er.textContent='Gib E-Mail und Passwort ein.';return;}
    btn.disabled=true;btn.textContent='Melde an …';

document.addEventListener('click',e=>{const b=e.target.closest('[data-gate]');if(!b)return;
  if(b.dataset.gate==='local'){lsSet('tj.mode','local');hideGate();startLocal();}
  if(b.dataset.gate==='setup')showGate('setup');});
function startLocal(){S.mode='local';SB=null;S.db=null;S.assets=null;S.sample=null;
  {const c=lsGet('tj.coach');if(c)S.coach={...S.coach,...c};}
  S.real.settings=lsGet('tj.settings');S.real.trades=lsGet('tj.trades')||[];S.real.settingsLoaded=true;render();}
let sbStarted=false;
function startSupabase(){
  const cfg=getCfg();if(!cfg)return showGate('setup');
  if(!window.supabase||!window.supabase.createClient)return showGate('setup','Die Supabase-Bibliothek konnte nicht geladen werden. Prüf deine Internetverbindung und lade die Seite neu.');
  try{SB=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true}});}catch(e){return showGate('setup',sbErr(e));}
  try{localStorage.removeItem('tj.mode');}catch(_){}
  SB.auth.onAuthStateChange((ev,session)=>{
    if(session&&session.user){if(S.uid===session.user.id&&S.mode==='db')return;hideGate();connectUser(session.user.id);}
    else if(ev==='SIGNED_OUT'||ev==='INITIAL_SESSION'){S.mode='loading';S.uid=null;S.real={settings:null,trades:[],settingsLoaded:false};showGate('login');}
  });
}
function connectUser(uid){
  S.mode='db';S.uid=uid;S.db=sbAdapter(SB,uid);S.assets=sbAssets(SB,uid);S.sample=sbSample(SB);S.real={settings:null,trades:[],settingsLoaded:false};

}
async function signOut(){if(SB)await SB.auth.signOut();}

function softRefresh(){if(S.mode!=='db'||!S.db||F||S.formDirty||document.hidden)return;if(Date.now()-lastRefresh<15000)return;lastRefresh=Date.now();S.db.refresh();}

/* ---------- Kameraaufnahme ---------- */
const REC={stream:null,rec:null,chunks:[],t0:0,timer:null,blob:null,type:'',dur:0,at:0};
function pickMime(){const c=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  for(const m of c)if(window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))return m;return '';}
const fmtDur=s=>Math.floor(s/60)+':'+pad(Math.floor(s%60));
const fmtMB=b=>nf1.format(b/1048576)+' MB';
async function recStart(){
  if(REC.rec)return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){toast('Dieser Browser kann keine Kameraaufnahme.');return;}
  try{REC.stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:640},height:{ideal:480},facingMode:'user'},audio:true});}
  catch(e){toast(e&&e.name==='NotAllowedError'?'Kamera-Zugriff abgelehnt. Erlaube ihn in den Browser-Einstellungen für diese Seite.':'Keine Kamera gefunden.');return;}
  const mime=pickMime();REC.chunks=[];
  try{REC.rec=new MediaRecorder(REC.stream,{...(mime?{mimeType:mime}:{}),videoBitsPerSecond:700000,audioBitsPerSecond:48000});}catch(_){REC.rec=new MediaRecorder(REC.stream);}
  REC.rec.ondataavailable=ev=>{if(ev.data&&ev.data.size)REC.chunks.push(ev.data);};
  REC.rec.onstop=()=>{const type=(REC.rec&&REC.rec.mimeType)||mime||'video/webm';REC.blob=new Blob(REC.chunks,{type});REC.type=type;REC.dur=(Date.now()-REC.t0)/1000;REC.at=Date.now();
    REC.stream.getTracks().forEach(t=>t.stop());REC.stream=null;REC.rec=null;clearInterval(REC.timer);renderRec();renderSide();renderTopbar();
    const big=REC.blob.size>48*1048576;
    toast(`Aufnahme fertig (${fmtDur(REC.dur)}, ${fmtMB(REC.blob.size)}).${big?' Für den Upload zu groß, lade sie herunter.':' Häng sie im nächsten Trade an.'}`,{label:'Herunterladen',fn:recDownload});
    if(F)renderVid();};
  REC.t0=Date.now();REC.rec.start(1000);REC.timer=setInterval(renderRecTime,1000);renderRec();renderSide();renderTopbar();
}
function recStop(){if(REC.rec&&REC.rec.state!=='inactive')REC.rec.stop();}
function recDownload(){if(!REC.blob)return;const ext=REC.type.includes('mp4')?'mp4':'webm';const d=new Date(REC.at);
  const fn=`trade-aufnahme-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.${ext}`;
  const url=URL.createObjectURL(REC.blob);const a=document.createElement('a');a.href=url;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);}
function renderRec(){const w=$('#recWin');
  if(!REC.rec){w.hidden=true;w.innerHTML='';return;}
  w.hidden=false;w.innerHTML=`<video id="recPrev" autoplay muted playsinline></video><div class="rec-bar"><span class="rec-dot" aria-hidden="true"></span><span id="recTime" class="num">0:00</span><button type="button" class="btn sm danger-solid" data-act="recStop">Stopp</button></div>`;
  const v=$('#recPrev');v.srcObject=REC.stream;}
function renderRecTime(){const t=$('#recTime');if(t)t.textContent=fmtDur((Date.now()-REC.t0)/1000);}
function recBtn(cls){return REC.rec?`<button type="button" class="${cls} rec-on" data-act="recStop" aria-label="Aufnahme stoppen">${ICON.cam}<span>Stopp</span></button>`
  :`<button type="button" class="${cls}" data-act="recStart" aria-label="Kameraaufnahme starten">${ICON.cam}<span>Aufnahme</span></button>`;}
function renderVid(){
  const box=$('#vid');if(!box||!F)return;
  if(S.demo){box.innerHTML='<p class="hint">In der Demo-Ansicht sind Videos deaktiviert.</p>';return;}
  if(F.vUploading){box.innerHTML='<p class="hint">Video wird hochgeladen … Das kann bei längeren Aufnahmen etwas dauern.</p>';return;}
  const msg=F.vMsg?`<p class="err">${esc(F.vMsg)}</p>`:'';
  if(F.video){box.innerHTML=`<video class="shot" controls playsinline preload="metadata" data-media="${esc(F.video)}"></video><div class="row-btns"><button type="button" class="link danger-link" data-act="rmVideo">Video entfernen</button></div>${msg}`;hydrateMedia(box);return;}
  const pend=REC.blob?`<div class="row-btns" style="margin-top:0">${S.assets?`<button type="button" class="btn ghost sm" data-act="attachRec">Letzte Aufnahme anhängen (${fmtDur(REC.dur)}, ${fmtMB(REC.blob.size)})</button>`:''}<button type="button" class="link" data-act="recDownload">Herunterladen</button></div>`:'';
  box.innerHTML=`${pend}${REC.rec?'<p class="hint">Aufnahme läuft. Stoppe sie, dann kannst du sie hier anhängen.</p>':!REC.blob?'<p class="hint">Starte vor dem Trade „Aufnahme“. Danach kannst du das Video hier anhängen.</p>':''}${!S.assets&&REC.blob?'<p class="hint">Videos speichern braucht die Verbindung zu Supabase. Lade die Aufnahme sonst herunter.</p>':''}${msg}`;
}
async function attachRec(){
  if(!F||!REC.blob||!S.assets)return;
  if(REC.blob.size>48*1048576){F.vMsg=`Die Aufnahme ist ${fmtMB(REC.blob.size)} groß. Supabase nimmt im Gratis-Tarif bis 50 MB pro Datei. Lade sie herunter.`;renderVid();return;}
  const f=F;f.vUploading=true;f.vMsg='';f.dirty=true;renderVid();
  try{const r=await S.assets.upload(REC.blob,{type:REC.type});if(f.video&&f.video!==f.oldVideo)S.assets.delete(f.video).catch(()=>{});f.video=r.id;}
  catch(e){f.vMsg=e&&e.code==='too_large'?'Das Video ist zu groß für deinen Speicher-Tarif.':'Upload fehlgeschlagen. Versuch es erneut.';}
  f.vUploading=false;if(F===f)renderVid();
}

async function init(){
  let h=location.hash.slice(1);if(h==='konto')h='dashboard';if(VIEWS.some(v=>v[0]===h))S.view=h;
  S.month=todayStr().slice(0,7);S.selDay=todayStr();
  render();
  if(getCfg()&&lsGet('tj.mode')!=='local')startSupabase();
  else if(lsGet('tj.mode')==='local')startLocal();
  else showGate('setup');
}
init();
})();
