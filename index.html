<title>Trading Journal</title>
<style>
:root{
  color-scheme:dark;
  --bg:#000000;--surface:#1C1C1E;--surface-2:rgba(255,255,255,.06);
  --ink:#F5F5F7;--ink-2:#AEAEB2;--ink-3:#7C7C82;
  --line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.16);
  --gain:#30D158;--loss:#FF453A;--warn:#FFD60A;--warn-bg:rgba(255,214,10,.10);
  --accent:#F5F5F7;--accent-ink:#000000;--focus:#0A84FF;--blue:#0A84FF;
  --glass:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.025)),rgba(22,22,26,.52);
  --glass-strong:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03)),rgba(20,20,24,.78);
  --glass-edge:rgba(255,255,255,.11);
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(255,255,255,.03),0 10px 40px rgba(0,0,0,.45);
  --blur:blur(28px) saturate(175%);
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,system-ui,sans-serif;
  --f-num:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
h1,h2,h3{font-family:var(--f-num);font-weight:600;margin:0;line-height:1.2}
h1{font-size:28px}h2{font-size:19px}h3{font-size:17px}
p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.sub{color:var(--ink-3);font-size:13px}
.hint{color:var(--ink-3);font-size:13px}
.lead{color:var(--ink-2);max-width:62ch}
.gain{color:var(--gain)}.loss{color:var(--loss)}.warn{color:var(--warn)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* App-Rahmen */
.side{display:none}
.main{min-width:0;max-width:1180px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;margin:0 -16px;padding:10px 16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font:600 19px var(--f-num);color:var(--ink);white-space:nowrap}
.mark{display:inline-block;width:32px;height:32px;flex:none;line-height:0}
.mark svg{width:100%;height:100%;display:block}
.acct-chip{appearance:none;margin-left:auto;display:flex;align-items:center;gap:4px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:500 15px var(--f-body);border-radius:999px;padding:0 10px 0 14px;min-height:40px;cursor:pointer;max-width:58vw}
.acct-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-chip .ico{width:16px;height:16px}
.icon-only{appearance:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-only[aria-current="page"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
.bottomnav button{appearance:none;background:none;border:0;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:500 12px var(--f-body);padding:4px 0;cursor:pointer;min-height:52px}
.bottomnav button[aria-current="page"]{color:var(--ink)}
.bottomnav button[aria-current="page"] .ico{stroke-width:2.3}
.bn-add .pill{width:46px;height:32px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.bottomnav .bn-add{color:var(--ink)}
@media (min-width:960px){
  body::before{display:none}
  .app{display:grid;grid-template-columns:256px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto;padding:22px 16px 18px;background:var(--surface);border-right:1px solid var(--line)}
  .topbar,.bottomnav{display:none}
  .main{padding:8px 36px 56px;margin:0;width:100%}
}
.side-acct{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2)}
.side-acct select{background:var(--surface);margin-top:4px}
.side-bal{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:10px}
.side-bal .num{font-weight:600;font-size:21px}
.side-nav{display:flex;flex-direction:column;gap:2px}
.side-nav button{appearance:none;display:flex;align-items:center;gap:12px;background:none;border:0;border-radius:10px;padding:10px 12px;font:500 16px var(--f-body);color:var(--ink-2);cursor:pointer;text-align:left}
.side-nav button:hover{background:var(--surface-2);color:var(--ink)}
.side-nav button[aria-current="page"]{background:var(--surface-2);color:var(--ink);font-weight:600}
.side-foot{margin-top:auto}

/* Seitenkopf */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:20px 0 14px}
.page-head .sub{font-size:14px;margin-top:4px}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}

/* Buttons */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:500 16px var(--f-body);min-height:44px;padding:0 18px;border-radius:10px;border:1px solid transparent;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-2)}
.btn.danger{background:transparent;color:var(--loss);border-color:color-mix(in srgb,var(--loss) 55%,transparent)}
.btn.danger-solid{background:var(--loss);color:var(--surface)}
.btn.sm{min-height:36px;padding:0 12px;font-size:15px}
.btn.block{width:100%}
.link{appearance:none;background:none;border:0;color:var(--accent);font:500 15px var(--f-body);cursor:pointer;padding:6px 0}
.link.danger-link{color:var(--loss)}
.row-btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}

/* Banner */
.banner{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;border-radius:10px;background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);margin-top:12px;font-size:15px}
.banner.bad{background:color-mix(in srgb,var(--loss) 12%,var(--surface));border-color:color-mix(in srgb,var(--loss) 45%,transparent)}

/* Kontokarte im Dashboard */
.acct{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px}
.acct-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px 20px;flex-wrap:wrap}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.phase{font-size:13px;font-weight:500;padding:2px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.phase.bad{color:var(--loss);border-color:color-mix(in srgb,var(--loss) 50%,transparent)}
.phase.good{color:var(--gain);border-color:color-mix(in srgb,var(--gain) 50%,transparent)}
.bal-l{font-size:13px;color:var(--ink-3)}
.bal-v{display:block;font-family:var(--f-num);font-weight:600;font-size:44px;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.runway{margin:24px 0 4px}
.rw-track{position:relative;height:16px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line)}
.rw-loss{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--loss) 24%,transparent);border-radius:8px 0 0 8px}
.rw-gain{position:absolute;top:0;bottom:0;right:0;background:color-mix(in srgb,var(--gain) 24%,transparent);border-radius:0 8px 8px 0}
.rw-mark{position:absolute;top:-9px;bottom:-9px;width:4px;margin-left:-2px;background:var(--ink);border-radius:2px}
.rw-labels{position:relative;height:22px;margin-top:12px;font-size:13px;color:var(--ink-2)}
.rw-labels span{position:absolute;white-space:nowrap;top:0}
.rw-note{margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px;margin-top:18px}
@media (min-width:760px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{border-top:1px solid var(--line);padding-top:10px;min-width:0}
.kpi-l{font-size:13px;color:var(--ink-3)}
.kpi-v{font-family:var(--f-num);font-weight:600;font-size:23px;font-variant-numeric:tabular-nums}
.kpi-s{font-size:13px;color:var(--ink-2)}
.alert{margin-top:14px;padding:10px 12px;border-radius:10px;font-size:15px;border:1px solid}
.alert.lv1{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.alert.bad{background:color-mix(in srgb,var(--loss) 12%,var(--surface));border-color:color-mix(in srgb,var(--loss) 45%,transparent)}
.alert.good{background:color-mix(in srgb,var(--gain) 12%,var(--surface));border-color:color-mix(in srgb,var(--gain) 45%,transparent)}

/* Panels und Raster */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px;min-width:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.panel>h2{margin-bottom:8px}
.empty{color:var(--ink-2);padding:6px 0}
.dash-grid{display:grid;gap:14px;margin-top:14px}
.dash-grid .panel,.cal-layout .panel,.set-grid .panel{margin-top:0}
@media (min-width:1100px){.dash-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.span2{grid-column:1/-1}}
.mini-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px 16px;margin-bottom:6px}
.mini-kpis .kpi-v{font-size:20px}
.set-grid{display:grid;gap:14px}
@media (min-width:1100px){.set-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Equity */
.eq{width:100%;height:clamp(150px,30vw,240px);display:block}
.eq-bal{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.eq-floor{fill:none;stroke:var(--loss);stroke-width:1.5;stroke-dasharray:6 4}
.eq-target{stroke:var(--gain);stroke-width:1.5;stroke-dasharray:2 4}
.eq-start{stroke:var(--line-2);stroke-width:1}
.eq-legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:14px;color:var(--ink-2)}
.eq-legend .num{color:var(--ink);font-weight:600}
.lg{display:inline-block;width:20px;height:0;border-top:2px solid var(--ink);vertical-align:middle;margin-right:6px}
.lg-floor{border-top:2px dashed var(--loss)}.lg-target{border-top:2px dotted var(--gain)}

/* Trade-Liste (mobil) und Tabelle (Desktop) */
.tlist{display:flex;flex-direction:column}
.trow{appearance:none;background:none;border:0;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr) auto auto;gap:4px 12px;align-items:center;padding:10px 2px;text-align:left;color:var(--ink);font:inherit;cursor:pointer;width:100%}
.trow:first-child{border-top:0}
.trow>span{display:flex;flex-direction:column;min-width:0}
.trow .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-psy{display:none!important}
.tr-r,.tr-pnl{text-align:right;font-family:var(--f-num);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (min-width:640px){.trow{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) 96px 72px 100px}.tr-psy{display:flex!important}}
.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:760px){.filters{grid-template-columns:repeat(4,minmax(0,1fr))}}
.t-summary{margin:14px 0 6px;color:var(--ink-2);font-size:15px}
.t-table{display:none}
@media (min-width:900px){.t-table{display:block}.t-list{display:none}}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th{font-weight:500;color:var(--ink-3);font-size:13px;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
th.r,td.r{text-align:right}
td.td-text{max-width:220px;overflow:hidden;text-overflow:ellipsis}
tr[data-edit]{cursor:pointer}
tr[data-edit]:hover td{background:var(--surface-2)}
.cell-btn{appearance:none;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left}

/* Kalender */
.cal-layout{display:grid;gap:14px}
@media (min-width:1100px){.cal-layout{grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);align-items:start}}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cal-nav{display:flex;gap:6px;align-items:center}
.cal-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}
.cal-sum .kpi-v{font-size:20px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) minmax(0,1.1fr);gap:3px}
.cal-h{font-size:12px;color:var(--ink-3);text-align:center;padding:2px 0}
.day{appearance:none;border:1px solid var(--line);border-radius:7px;background:var(--surface);min-height:58px;padding:3px 3px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;color:var(--ink);font:inherit;min-width:0;overflow:hidden}
.day .dn{font-size:12px;color:var(--ink-3)}
.day .dp{font-family:var(--f-num);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums;line-height:1.1;letter-spacing:-.02em;white-space:nowrap}
.day .dm{font-size:12px;color:var(--ink-2);display:none}
.day.blank{visibility:hidden}
.day[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}
.day.today .dn{color:var(--ink);font-weight:600}
.wk{display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-weight:600;font-size:13px;letter-spacing:-.02em;white-space:nowrap;font-variant-numeric:tabular-nums;border-left:1px solid var(--line)}
@media (min-width:700px){.day{min-height:84px;padding:6px 8px}.day .dp{font-size:18px}.day .dm{display:block}.wk{font-size:16px}}
.cal-legend{margin-top:10px}

/* Auswertung */
.figs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 18px}
@media (min-width:760px){.figs{grid-template-columns:repeat(4,minmax(0,1fr))}}
.fig-l{font-size:13px;color:var(--ink-3)}
.fig-v{font:600 21px var(--f-num);font-variant-numeric:tabular-nums}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px}

/* Konten */
.acct-group>h2{margin:18px 0 10px}
.acct-group:first-child>h2{margin-top:4px}
.acct-cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.acard.is-open{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.acard-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.acard-head h3{overflow-wrap:anywhere}
.acard-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;margin:0}
.acard-stats dt{font-size:13px;color:var(--ink-3)}
.acard-stats dd{margin:0;font:600 19px var(--f-num);font-variant-numeric:tabular-nums}
.acard .row-btns{margin-top:0}
.acard .alert{margin-top:0}
.confirm{border:1px solid color-mix(in srgb,var(--loss) 45%,transparent);background:color-mix(in srgb,var(--loss) 10%,var(--surface));border-radius:10px;padding:12px;font-size:15px}

/* Formulare */
fieldset{border:0;padding:0;margin:0 0 18px}
legend{font:600 16px var(--f-num);padding:0;margin-bottom:10px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fl{font-size:13px;color:var(--ink-2);font-weight:500}
input[type=text],input[type=date],input[type=time],select,textarea{font:400 16px var(--f-body);color:var(--ink);background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;min-height:44px;padding:8px 10px;width:100%}
textarea{min-height:96px;resize:vertical}
.err{font-size:13px;color:var(--loss)}
.err:empty{display:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:520px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.grid2:not(.keep){grid-template-columns:minmax(0,1fr)}}
select{min-width:0;max-width:100%}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.chip,.scale button{appearance:none;font:500 15px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:8px;min-height:40px;padding:0 12px;cursor:pointer}
.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.seg.sm button{min-height:34px;font-size:14px;padding:0 10px}
.instr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.instr button{padding:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:999px;min-height:36px;font-size:14px}
.scale{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.scale button{padding:0;font-family:var(--f-num);font-size:18px;min-height:44px}
.scale button[aria-pressed="true"]{color:var(--surface)}
.scale button[aria-pressed="true"][data-lv="lo"]{background:var(--loss);border-color:var(--loss)}
.scale button[aria-pressed="true"][data-lv="mid"]{background:var(--warn);border-color:var(--warn)}
.scale button[aria-pressed="true"][data-lv="hi"]{background:var(--gain);border-color:var(--gain)}
.scale-ends{display:flex;justify-content:space-between;margin-top:4px}
.tag{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line-2);border-radius:999px;padding:2px 4px 2px 12px;font-size:14px}
.tag button{appearance:none;background:none;border:0;color:var(--ink-3);font-size:18px;line-height:1;width:30px;height:30px;cursor:pointer;border-radius:999px}
.add-row{display:flex;gap:8px;margin-top:12px}
.add-row input{flex:1}

/* Trade-Formular */
#sheet{position:fixed;inset:0;z-index:50;background:rgba(9,13,19,.55);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.sheet-panel{background:var(--surface);color:var(--ink);max-width:720px;margin:0 auto;border-radius:16px;padding:18px 18px 0;border:1px solid var(--line)}
.sheet-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding-bottom:6px}
.sec{padding:16px 0;border-top:1px solid var(--line)}
.sec>h3{margin-bottom:12px}
.stack{display:flex;flex-direction:column;gap:14px}
.live{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
@media (min-width:600px){.live{grid-template-columns:repeat(4,minmax(0,1fr))}}
.lv{font:600 19px var(--f-num);font-variant-numeric:tabular-nums}
.live-warn{grid-column:1/-1;color:var(--warn);font-size:14px;font-weight:500}
.exit-row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto;gap:10px;align-items:end;margin-bottom:8px}
.icon-btn{appearance:none;width:44px;height:44px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);font-size:20px;cursor:pointer}
.shot{max-width:100%;border-radius:8px;border:1px solid var(--line);display:block}
.sheet-foot{position:sticky;bottom:-12px;background:var(--surface);border-top:1px solid var(--line);padding:12px 0 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end;margin-top:4px}
.sheet-foot .err{margin-right:auto}

/* Auswertung */
.jump{display:flex;gap:6px;overflow-x:auto;margin:14px 0 0;padding-bottom:2px;scrollbar-width:none}
.jump::-webkit-scrollbar{display:none}
.jump a{flex:none;text-decoration:none;color:var(--ink);border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500}
.bars{display:flex;flex-direction:column}
.br{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(70px,1.4fr) minmax(0,1fr);gap:4px 12px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.br:first-child{border-top:0}
.br.low,tr.low,td.low{opacity:.5}
.bl-l{display:flex;flex-direction:column;min-width:0}.bl-l span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.bt{position:relative;height:12px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line)}
.bt b{position:absolute;top:0;bottom:0;border-radius:6px}
.bt .half,.bt .mid{position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--ink-3)}
.bg{background:var(--gain)}.bl{background:var(--loss)}
.bv{display:flex;flex-direction:column;align-items:flex-end;text-align:right;font-variant-numeric:tabular-nums}
.bv strong{font:600 17px var(--f-num)}
.bv .sub{white-space:nowrap}
.hist{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px;height:180px;align-items:end}
.hc{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:3px;min-width:0}
.hc b{width:100%;border-radius:4px 4px 0 0;min-height:2px}
.hl{font-size:11px;color:var(--ink-3);white-space:nowrap;transform:rotate(-35deg);transform-origin:center;margin-top:8px;height:22px}
table.heat td.c,table.heat th.c{text-align:center}
table.heat td.c{padding:5px 6px;border:2px solid var(--surface);border-radius:6px}
table.heat td.c strong{display:block;font:600 15px var(--f-num)}table.heat td.c .sub{font-size:11px}
table.heat td.e{background:var(--surface-2)}
.mx-ctl{margin-bottom:14px}
.sc{width:100%;height:auto;display:block}
.sc text{font:500 15px var(--f-num);fill:var(--ink-3)}
.sc .axg{stroke:var(--line);stroke-width:1}.sc .ax0{stroke:var(--line-2);stroke-width:1.5}
.sc .dg{fill:color-mix(in srgb,var(--gain) 55%,transparent)}.sc .dl{fill:color-mix(in srgb,var(--loss) 55%,transparent)}
.sc .avgl{fill:none;stroke:var(--ink);stroke-width:2}.sc .avgd{fill:var(--ink)}
.dd-area{fill:color-mix(in srgb,var(--loss) 30%,transparent);stroke:var(--loss);stroke-width:1}
.lg-dd{border-top:6px solid color-mix(in srgb,var(--loss) 40%,transparent)}
.ins{margin:8px 0 0;padding:0;list-style:none}
.ins li{padding:8px 0 8px 14px;border-top:1px solid var(--line);position:relative}
.ins li:first-child{border-top:0}
.ins li::before{content:"";position:absolute;left:0;top:16px;width:6px;height:6px;border-radius:50%;background:var(--ink-3)}
.ins li.gain::before{background:var(--gain)}.ins li.loss::before{background:var(--loss)}
.coach{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:4px 16px 12px;line-height:1.6}
.coach h3{margin:14px 0 4px}.coach p{margin:6px 0}.coach ul,.coach ol{margin:6px 0;padding-left:20px}
.coach-meta{margin:14px 0 6px}
.btn[disabled]{opacity:.5;cursor:default}
/* Aufklappbare Formularbereiche */
details.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;font:600 17px var(--f-num);min-height:32px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg);margin:0 6px 4px 0;flex:none}
details.sec[open]>summary::after{transform:rotate(-135deg);margin-bottom:-4px}
details.sec>summary .sub{font-family:var(--f-body);font-weight:400;margin-left:6px}
details.sec>.stack{margin-top:14px}
.sheet-panel>.hint{margin-bottom:10px}
/* Erste Schritte */
.steps{list-style:none;margin:8px 0 0;padding:0;counter-reset:s}
.steps li{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px 16px;padding:12px 0;border-top:1px solid var(--line);counter-increment:s}
.steps li:first-child{border-top:0}
.steps li>span:first-child{display:flex;gap:10px;align-items:flex-start;flex:1 1 260px}
.steps li>span:first-child::before{content:counter(s);display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1px solid var(--line-2);font:600 13px var(--f-num);flex:none}
.steps li.done>span:first-child::before{content:"✓";background:var(--gain);color:var(--surface);border-color:var(--gain)}
/* Zugang und Aufnahme */
#gate{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:max(48px,env(safe-area-inset-top)) 16px 48px}
.gate-card{width:100%;max-width:460px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px}
.rec-win{position:fixed;left:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;width:200px;background:var(--ink);border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.3)}
@media (min-width:960px){.rec-win{bottom:24px;left:276px;width:240px}}
.rec-win video{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;transform:scaleX(-1);background:#000}
.rec-bar{display:flex;align-items:center;gap:8px;padding:8px 10px;color:var(--surface)}
.rec-bar .btn{margin-left:auto}
.rec-dot{width:10px;height:10px;border-radius:50%;background:#E5484D}
@media (prefers-reduced-motion:no-preference){.rec-dot{animation:recp 1.2s ease-in-out infinite}}
@keyframes recp{50%{opacity:.3}}
.rec-on{color:#E5484D!important;border-color:#E5484D!important}
.side .rec-btn{appearance:none;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:40px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:500 15px var(--f-body);cursor:pointer}
.topbar .rec-btn{appearance:none;display:flex;align-items:center;gap:4px;height:40px;padding:0 10px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:500 14px var(--f-body);cursor:pointer;flex:none}
.topbar .rec-btn span{display:none}
@media (min-width:420px){.topbar .rec-btn span{display:inline}}
/* Toast */
.toast-wrap{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;justify-content:center;padding:0 16px calc(84px + env(safe-area-inset-bottom,0px));pointer-events:none}
@media (min-width:960px){.toast-wrap{padding-bottom:24px}}
#toast{background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:10px;font-size:15px;opacity:0;transition:opacity .2s}
#toast.on{opacity:1}
#toast.has-act{pointer-events:auto}
.toast-act{appearance:none;background:none;border:0;color:inherit;font:600 15px var(--f-body);text-decoration:underline;margin-left:12px;padding:4px;cursor:pointer}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

/* ===== Liquid Glass ===== */
html{background:#000}
body{background:transparent;letter-spacing:-.005em}
body::before{background:rgba(0,0,0,.6);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.ambient{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:#000}
.ambient i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55}
.ambient i:nth-child(1){width:55vmax;height:55vmax;left:-15vmax;top:-20vmax;background:radial-gradient(circle,#1d3a8a 0%,transparent 65%)}
.ambient i:nth-child(2){width:45vmax;height:45vmax;right:-18vmax;top:20vh;background:radial-gradient(circle,#0f5a4a 0%,transparent 65%);opacity:.4}
.ambient i:nth-child(3){width:50vmax;height:50vmax;left:20vw;bottom:-28vmax;background:radial-gradient(circle,#4a1d6e 0%,transparent 65%);opacity:.35}
h1{font-size:32px;font-weight:700;letter-spacing:-.025em}
h2{font-size:19px;font-weight:600;letter-spacing:-.015em}
h3{font-weight:600;letter-spacing:-.01em}
.num,.kpi-v,.fig-v,.bal-v,.lv,.dp,.wk,.tr-r,.tr-pnl{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bal-v{font-size:52px;font-weight:700;letter-spacing:-.035em}
.kpi-v{font-weight:650}
.sub,.hint{color:var(--ink-3)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* Glasflächen */
.panel,.acct,.acard,.gate-card,.steps-card{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-edge);box-shadow:var(--glass-hi);border-radius:24px}
.panel{padding:20px}
.acct{padding:24px 24px 20px;border-radius:28px}
.acard{border-radius:22px}
.acard.is-open{border-color:rgba(255,255,255,.35);box-shadow:var(--glass-hi),0 0 0 1px rgba(255,255,255,.2)}
.kpi{border-top:1px solid var(--line)}
.topbar{background:rgba(0,0,0,.45);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-bottom:1px solid var(--line)}
.bottomnav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:6px;border-radius:30px;background:var(--glass-strong);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-edge);box-shadow:var(--glass-hi)}
.bottomnav button{border-radius:22px;min-height:54px}
.bottomnav button[aria-current="page"]{background:rgba(255,255,255,.10)}
.bn-add .pill{background:#F5F5F7;color:#000;border-radius:16px;box-shadow:0 4px 18px rgba(255,255,255,.18)}
.main{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
@media (min-width:960px){
  .app{grid-template-columns:272px minmax(0,1fr)}
  .side{margin:12px;height:calc(100vh - 24px);top:12px;border-radius:28px;background:var(--glass-strong);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-edge);box-shadow:var(--glass-hi)}
  .main{padding:8px 36px 56px 24px}
}
.side-acct{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:18px}
.side-nav button{border-radius:14px}
.side-nav button:hover{background:rgba(255,255,255,.06)}
.side-nav button[aria-current="page"]{background:rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}

/* Buttons und Steuerelemente */
.btn{border-radius:999px;font-weight:600;transition:transform .12s ease,background .2s}
.btn:active{transform:scale(.97)}
.btn:not(.ghost):not(.danger):not(.danger-solid){background:#F5F5F7;color:#000;box-shadow:0 4px 20px rgba(255,255,255,.12)}
.btn.ghost{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12);color:var(--ink);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.btn.ghost:hover{background:rgba(255,255,255,.12)}
.btn.danger{background:rgba(255,69,58,.10);border-color:rgba(255,69,58,.35)}
.btn.danger-solid{background:var(--loss);color:#fff}
.link{color:var(--blue)}
.icon-only,.acct-chip,.topbar .rec-btn,.side .rec-btn{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12)}
.acct-chip{border-radius:999px}
.icon-only,.topbar .rec-btn{border-radius:999px}
.side .rec-btn{border-radius:999px}
.icon-only[aria-current="page"]{background:#F5F5F7;color:#000;border-color:#F5F5F7}
input[type=text],input[type=date],input[type=time],input[type=email],input[type=password],select,textarea{background:rgba(255,255,255,.06)!important;border:1px solid rgba(255,255,255,.12)!important;border-radius:14px!important;color:var(--ink)!important}
input:focus,select:focus,textarea:focus{border-color:var(--blue)!important;outline:none;box-shadow:0 0 0 3px rgba(10,132,255,.25)}
select option{background:#1C1C1E;color:#F5F5F7}
.seg button,.chip,.scale button{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);border-radius:12px}
.chip{border-radius:999px}
.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{background:#F5F5F7;color:#000;border-color:#F5F5F7}
.scale button[aria-pressed="true"][data-lv="lo"]{color:#fff}
.scale button[aria-pressed="true"][data-lv="mid"],.scale button[aria-pressed="true"][data-lv="hi"]{color:#000}
.tag{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.12)}
.phase{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12)}
.jump a{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}

/* Kontokarte */
.rw-track{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.08);height:12px;border-radius:6px}
.rw-loss{background:linear-gradient(90deg,rgba(255,69,58,.55),rgba(255,69,58,.15));border-radius:6px 0 0 6px}
.rw-gain{background:linear-gradient(90deg,rgba(48,209,88,.12),rgba(48,209,88,.5));border-radius:0 6px 6px 0}
.rw-mark{background:#fff;width:4px;box-shadow:0 0 12px rgba(255,255,255,.8)}
.alert{border-radius:16px}
.alert.lv1{background:rgba(255,214,10,.08);border-color:rgba(255,214,10,.3)}
.alert.bad{background:rgba(255,69,58,.10);border-color:rgba(255,69,58,.35)}
.alert.good{background:rgba(48,209,88,.10);border-color:rgba(48,209,88,.35)}
.banner{border-radius:16px;background:rgba(255,214,10,.08);border-color:rgba(255,214,10,.3)}
.banner.bad{background:rgba(255,69,58,.10)}
.confirm{border-radius:16px;background:rgba(255,69,58,.10)}

/* Charts */
.eq-bal{stroke:#fff;stroke-width:2.2;filter:drop-shadow(0 0 6px rgba(255,255,255,.35))}
.eq-floor{stroke:var(--loss)}
.eq-target{stroke:var(--gain)}
.eq-start{stroke:rgba(255,255,255,.18)}
.dd-area{fill:rgba(255,69,58,.22)}
.bt{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.06);height:10px}
.bg{background:linear-gradient(90deg,rgba(48,209,88,.55),var(--gain))}
.bl{background:linear-gradient(90deg,rgba(255,69,58,.55),var(--loss))}
.hc b.bg{background:linear-gradient(180deg,var(--gain),rgba(48,209,88,.35))}
.hc b.bl{background:linear-gradient(180deg,var(--loss),rgba(255,69,58,.35))}
.sc .avgl{stroke:#fff}.sc .avgd{fill:#fff}
table.heat td.c{border:2px solid transparent;background-clip:padding-box;border-radius:10px}
table.heat td.e{background:rgba(255,255,255,.03)}
th{color:var(--ink-3)}
tr[data-edit]:hover td{background:rgba(255,255,255,.05)}
.ins li.gain,.ins li.loss{color:var(--ink)}
.coach{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.08);border-radius:18px}

/* Kalender */
.day{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.07);border-radius:12px}
.day:hover{border-color:rgba(255,255,255,.2)}
.day[aria-pressed="true"]{outline:2px solid #fff;outline-offset:1px}
.wk{border-left-color:var(--line)}

/* Listen */
.trow{border-top-color:var(--line);border-radius:12px;padding:12px 8px}
.trow:hover{background:rgba(255,255,255,.04)}
.steps li>span:first-child::before{border-color:rgba(255,255,255,.2)}
.steps li.done>span:first-child::before{color:#000}

/* Formular-Sheet */
#sheet{background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.sheet-panel{background:var(--glass-strong);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-edge);box-shadow:var(--glass-hi);border-radius:28px}
.sheet-foot{background:rgba(24,24,28,.9);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-top:1px solid var(--line);margin:4px -18px 0;padding:12px 18px 16px;border-radius:0 0 28px 28px}
.tlist{container-type:inline-size}
@media (min-width:640px){.trow{grid-template-columns:minmax(0,1fr) minmax(0,1.35fr) auto auto}.tr-psy{display:none!important}}
@container (min-width:560px){.trow{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) 96px 72px 100px}.tr-psy{display:flex!important}}
.live{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.08);border-radius:18px}
.icon-btn{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);border-radius:12px}

/* Sonstiges */
#toast{background:rgba(40,40,46,.82);color:#fff;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-edge);border-radius:999px;padding:10px 18px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.rec-win{background:rgba(20,20,24,.75);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-edge);border-radius:22px}
.rec-bar{color:#fff}
.gate-card{padding:28px}
.mark{filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}
.topbar .mark{width:36px;height:36px}
.side .mark{width:36px;height:36px}
.gate-card .mark{width:44px;height:44px}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .panel,.acct,.acard,.gate-card,.side,.bottomnav,.sheet-panel{background:#16161a}
}

/* ===== Bento-Dashboard ===== */

.tile{position:relative;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-edge);box-shadow:var(--glass-hi);border-radius:28px;padding:20px;min-width:0;overflow:hidden}

.hero-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.hero-v{font:700 clamp(40px,7vw,60px)/1.02 var(--f-num);letter-spacing:-.045em;margin:6px 0 10px;font-variant-numeric:tabular-nums}

.ringtile{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;min-height:200px}
.ring-wrap{position:relative;width:min(132px,100%);aspect-ratio:1}
.ring{width:100%;height:100%}

.ring.g .ring-fg{stroke:#30D158;filter:drop-shadow(0 0 6px rgba(48,209,88,.6))}

.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-v{font:700 24px var(--f-num);letter-spacing:-.03em}
.ring-l{font-size:11px;color:var(--ink-3);margin-top:2px}
.banner{border-radius:999px;padding:8px 8px 8px 18px;background:var(--glass)!important;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-edge)!important;font-size:14px}

.alerts{display:flex;flex-direction:column;gap:8px}.alerts .alert{margin:0}

.trow{grid-template-columns:40px minmax(0,1fr) auto auto!important;gap:4px 12px;padding:10px 8px;border-top:0!important;border-radius:16px}

<body>
<div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="app">
  <aside class="side" id="side"></aside>
  <div class="main">

<div class="toast-wrap"><div id="toast" role="status" aria-live="polite"></div></div>
<script>
(function(){
'use strict';

/* ---------- Konstanten ---------- */
const INSTR={NQ:{pv:20,tick:0.25,mini:1},MNQ:{pv:2,tick:0.25,mini:0.1},ES:{pv:50,tick:0.25,mini:1},MES:{pv:5,tick:0.25,mini:0.1},GC:{pv:100,tick:0.1,mini:1},MGC:{pv:10,tick:0.1,mini:0.1},CL:{pv:1000,tick:0.01,mini:1},MCL:{pv:100,tick:0.01,mini:0.1}};
const INSTR_LIST=Object.keys(INSTR);
const CONF_DEFAULT=['Value Area High/Low','POC','Initial Balance','HVN/LVN','VWAP/VWAP-Bänder','Key Time (10:00 ET)','Fibonacci','Liquidity Sweep','Absorption','Delta/CVD-Divergenz','Stacked Imbalances','GEX/DEX-Level','BOS/CHoCH','HTF-Bias aligned'];
const SETUP_DEFAULT=['Value-Area-Rejection','Liquidity Sweep + Reclaim','IB-Breakout','VWAP-Reversion'];
const EMOTIONS=['ruhig','fokussiert','FOMO','Angst','Gier','Ungeduld','Frust','Revenge','Überheblichkeit','müde'];
const ERRORS=['zu früh','zu spät','Stop verschoben','zu groß','Revenge','Overtrading','gegen Bias','Regime-Mismatch','News','kein Setup'];
const REGIMES=['Trend','Range','High Volatility','News'];
const GRADES=['A+','A','B','C'];
const RATINGS=['gut','neutral','schlecht'];
const SESSIONS=[[0,60,'Pre-Asia'],[60,480,'Asia'],[480,870,'London'],[870,930,'Pre-NY'],[930,1020,'NY Open'],[1020,1200,'NY Midday'],[1200,1320,'NY Close'],[1320,1440,'Pre-Asia']];
const SESSION_ORDER=['Pre-Asia','Asia','London','Pre-NY','NY Open','NY Midday','NY Close'];
const SL_REASONS=['Absorption','Key Level','Swing High/Low','Liquidity','VWAP','Feste Punkte'];
const REACTIONS=['stark','schwach','keine','durchgebrochen'];
const EXIT_REASONS=['Target','Stop Loss','Break-even','Trailing Stop','Manuell']
const VIEWS=[['dashboard','Dashboard','dash'],['kalender','Kalender','cal'],['trades','Trades','list'],['auswertung','Auswertung','bars'],['konten','Konten','wallet'],['einstellungen','Einstellungen','sliders']];
const PHASES={evaluation:'Evaluation',funded:'Funded',sim:'Sim'};
const STATUS_L={aktiv:'Aktiv',bestanden:'Bestanden',verloren:'Verloren'};
const DDTYPES={eod:'EOD Trailing',intraday:'Intraday Trailing',static:'Static'};
const OPTIONAL_SEG=new Set(['grade','regime','planFollowed','rateEntry','rateMgmt','rateExit','stabAfter','slReason','reaction','beMoved','exitReason']);
const NUM_KEYS=new Set(['size','profitTarget','maxLoss','lockAt','dailyLossLimit','personalDailyLimit','maxMinis','minDays','consistencyPct','startBalance','startFloor','priorDays','cost','funded.consistencyPct']);
const MONTHS=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const WD=['Mo','Di','Mi','Do','Fr','Sa','So'];

/* ---------- Helfer ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const pad=n=>String(n).padStart(2,'0');
const round2=x=>Math.round((x+Number.EPSILON)*100)/100;
const sum=a=>a.reduce((s,x)=>s+x,0);
const avg=a=>a.length?sum(a)/a.length:null;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const nf0=new Intl.NumberFormat('de-DE',{maximumFractionDigits:0});
const nf2=new Intl.NumberFormat('de-DE',{minimumFractionDigits:0,maximumFractionDigits:2});
const nf1=new Intl.NumberFormat('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1});
const nfc=new Intl.NumberFormat('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
function parseNum(v){if(v==null)return null;const s=String(v).trim().replace(/\s/g,'').replace(',','.');if(s==='')return null;const n=Number(s);return isFinite(n)?n:NaN;}
function numStr(n){return n==null||n===''?'':String(n).replace('.',',');}
function fmtN(n){return n==null||!isFinite(n)?'–':nf2.format(n);}
function money(v,signed){if(v==null||!isFinite(v))return '–';const s=v<0?'−':(signed&&v>0?'+':'');const a=Math.abs(round2(v));return s+(Number.isInteger(a)?nf0.format(a):nfc.format(a))+' $';}
function money0(v,signed){if(v==null||!isFinite(v))return '–';const s=v<0?'−':(signed&&v>0?'+':'');return s+nf0.format(Math.abs(Math.round(v)))+' $';}
function compact(v){const a=Math.abs(v);const s=v<0?'−':v>0?'+':'';return s+(a>=1000?nf1.format(a/1000)+'k':nf0.format(Math.round(a)));}
function fmtR(v){if(v==null||!isFinite(v))return '–';const s=v<0?'−':(v>0?'+':'');return s+nf1.format(Math.abs(v))+' R';}
function pct(v,d=0){if(v==null||!isFinite(v))return '–';return (v*100).toLocaleString('de-DE',{maximumFractionDigits:d})+' %';}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function nowTime(){const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());}
function toMin(t){if(!t||!/^\d{2}:\d{2}$/.test(t))return null;const [h,m]=t.split(':').map(Number);return h*60+m;}
function hm(m){m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60);}
function sessionOf(t){const m=toMin(t);if(m==null)return '–';for(const [a,b,n] of SESSIONS)if(m>=a&&m<b)return n;return '–';}
function fmtDate(ds){const [y,m,d]=ds.split('-').map(Number);const dt=new Date(y,m-1,d);return WD[(dt.getDay()+6)%7]+', '+pad(d)+'.'+pad(m)+'.';}
function lsGet(k){try{const s=localStorage.getItem(k);return s?JSON.parse(s):null;}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){S.saveErr='Speichern im Browser nicht möglich. Exportiere regelmäßig ein Backup.';renderBanner();}}
let toastState=null;
function toast(msg,opt){
  const el=$('#toast');
  if(toastState&&toastState.onExpire){const f=toastState.onExpire;toastState=null;try{f();}catch(_){}}
  clearTimeout(toast._t);toastState=opt||null;
  el.innerHTML=esc(msg)+(opt&&opt.label?`<button type="button" class="toast-act">${esc(opt.label)}</button>`:'');
  el.classList.add('on');el.classList.toggle('has-act',!!(opt&&opt.label));
  toast._t=setTimeout(()=>{el.classList.remove('on','has-act');if(toastState===opt){toastState=null;if(opt&&opt.onExpire)opt.onExpire();}},opt&&opt.label?6000:2400);
}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---------- Zustand ---------- */
const S={mode:'loading',db:null,uid:null,assets:null,downloads:null,
  real:{settings:null,trades:[],settingsLoaded:false},
  demo:null,view:'dashboard',month:null,selDay:null,slow:false,saveErr:null,dbError:null,
  formDirty:false,acctEdit:null,delAcct:null,onboardAcct:null,newAcct:null,tf:{instr:'',result:'',month:'',setup:''},af:{range:'all',instr:'',session:''},mx:{row:'session',col:'confl',metric:'wr'},coach:{text:'',q:''},sample:null,coachDenied:false,pendingImport:null,importErr:null};
const settings=()=>S.demo?S.demo.settings:S.real.settings;
const allTrades=()=>S.demo?S.demo.trades:S.real.trades;
function activeAccount(){const st=settings();if(!st||!st.accounts||!st.accounts.length)return null;return st.accounts.find(a=>a.id===st.activeAccountId)||st.accounts[0];}
function isLoading(){return S.mode==='loading'||(S.mode==='db'&&!S.real.settingsLoaded&&!S.demo);}

function defaultAccount(){
  return {id:newId('a'),name:'Lucid 25K',firm:'Lucid Trading',phase:'evaluation',status:'aktiv',
    size:25000,profitTarget:1250,maxLoss:1000,ddType:'eod',lockAt:null,dailyLossLimit:0,personalDailyLimit:300,
    maxMinis:2,minDays:0,consistencyPct:0,startBalance:25000,startFloor:24000,priorDays:0,cost:null,
    funded:{consistencyPct:null,payoutNote:''},createdAt:Date.now()};
}
function defaultSettings(acc){return {version:1,activeAccountId:acc.id,accounts:[acc],confluences:CONF_DEFAULT.slice(),setups:SETUP_DEFAULT.slice(),commissions:{mini:0,micro:0}};}

/* ---------- Berechnungen ---------- */
const calcCache=new WeakMap();
function calc(t){
  if(calcCache.has(t))return calcCache.get(t);
  const ins=INSTR[t.instrument]||INSTR.MNQ;const pv=ins.pv;
  let gross=0,q=0,px=0;
  for(const e of (t.exits||[])){gross+=(e.price-t.entry)*t.dir*pv*e.qty;q+=e.qty;px+=e.price*e.qty;}
  gross=round2(gross);
  const net=round2(gross-(Number(t.commission)||0));
  const stopDist=(t.stop!=null&&isFinite(t.stop))?Math.abs(t.entry-t.stop):0;
  const risk=round2(stopDist*pv*t.contracts);
  const R=risk>0?net/risk:null;
  const plannedR=(stopDist>0&&t.target!=null&&isFinite(t.target))?Math.abs(t.target-t.entry)/stopDist:null;
  let hold=null;const a=toMin(t.entryTime),b=toMin(t.exitTime);if(a!=null&&b!=null){hold=b-a;if(hold<0)hold+=1440;}
  const em=toMin(t.entryTime);const [yy,mm,dd]=(t.date||'2000-01-01').split('-').map(Number);
  const c={gross,net,risk,R,plannedR,hold,avgExit:q?px/q:null,mini:ins.mini*t.contracts,session:sessionOf(t.entryTime),
    slPts:stopDist,resPts:q?(px/q-t.entry)*t.dir:null,hour:em!=null?Math.floor(em/60):null,wd:(new Date(yy,mm-1,dd).getDay()+6)%7};
  calcCache.set(t,c);return c;
}
function sortKey(t){return t.date+' '+(t.entryTime||'00:00')+' '+String(t.createdAt||0).padStart(15,'0');}
function acctTrades(acc){return allTrades().filter(t=>t.accountId===acc.id).sort((a,b)=>sortKey(a)<sortKey(b)?-1:1);}
function enrich(list){
  let lastDate=null,n=0,lastExit=null;
  return list.map(t=>{const c=calc(t);if(t.date!==lastDate){n=0;lastExit=null;lastDate=t.date;}n++;
    const em=toMin(t.entryTime);const since=(lastExit!=null&&em!=null)?em-lastExit:null;
    const ex=toMin(t.exitTime);lastExit=ex!=null?ex:em;return {t,c,no:n,since};});
}
function engine(acc,rows){
  const ML=+acc.maxLoss||0;const lock=acc.lockAt>0?+acc.lockAt:null;
  let bal=+acc.startBalance;let floor=+acc.startFloor;let hwm=floor+ML;
  const fl=h=>{let f=h-ML;if(lock!=null)f=Math.min(f,lock);return f;};
  const today=todayStr();const curve=[{bal,floor}];let breach=null;const days=new Map();
  let i=0;
  while(i<rows.length){
    const d=rows[i].t.date;
    while(i<rows.length&&rows[i].t.date===d){
      const r=rows[i];bal=round2(bal+r.c.net);days.set(d,round2((days.get(d)||0)+r.c.net));
      if(acc.ddType==='intraday'){hwm=Math.max(hwm,bal);floor=Math.max(floor,fl(hwm));}
      if(!breach&&bal<=floor)breach={date:d,id:r.t.id};
      curve.push({bal,floor});i++;
    }
    if(acc.ddType==='eod'&&d<today){hwm=Math.max(hwm,bal);floor=Math.max(floor,fl(hwm));}
  }
  if(curve[curve.length-1].floor!==floor)curve.push({bal,floor});
  return {bal,floor,hwm,curve,breach,days,locked:lock!=null&&floor>=lock};
}
function acctStatus(acc){
  const rows=enrich(acctTrades(acc));const E=engine(acc,rows);
  const size=+acc.size||0;const target=size+(+acc.profitTarget||0);const ML=+acc.maxLoss||0;
  const buffer=round2(E.bal-E.floor);
  const used=ML>0?clamp((ML-buffer)/ML,0,1.5):0;
  const todayNet=E.days.get(todayStr())||0;
  const recent=rows.filter(r=>r.c.risk>0).slice(-20);const avgRisk=recent.length?avg(recent.map(r=>r.c.risk)):null;
  const exp=rows.length?sum(rows.map(r=>r.c.net))/rows.length:null;
  const remaining=round2(target-E.bal);const profit=round2(E.bal-size);
  const tradedDays=E.days.size+(+acc.priorDays||0);
  const cp=acc.phase==='funded'?+((acc.funded&&acc.funded.consistencyPct)||0):+(acc.consistencyPct||0);
  let cons=null;
  if(cp>0){const best=Math.max(0,...E.days.values());
    if(profit>0){const p=best/profit;cons={best,pct:p,cp,need:p*100>cp?round2(best/(cp/100)-profit):0};}
    else cons={best,pct:null,cp,need:null};}
  return {rows,E,buffer,used,todayNet,avgRisk,exp,remaining,profit,tradedDays,cons,target,size};
}
function stats(rows){
  const n=rows.length;if(!n)return null;
  const nets=rows.map(r=>r.c.net);const wins=nets.filter(x=>x>0),losses=nets.filter(x=>x<0);
  const gw=sum(wins),gl=Math.abs(sum(losses));
  const Rs=rows.filter(r=>r.c.R!=null).map(r=>r.c.R);
  let cum=0,peak=0,mdd=0;for(const x of nets){cum+=x;peak=Math.max(peak,cum);mdd=Math.min(mdd,cum-peak);}
  let ws=0,ls=0,cw=0,cl=0;for(const x of nets){if(x>0){cw++;cl=0;}else if(x<0){cl++;cw=0;}else{cw=0;cl=0;}ws=Math.max(ws,cw);ls=Math.max(ls,cl);}
  const dm=new Map();rows.forEach(r=>dm.set(r.t.date,(dm.get(r.t.date)||0)+r.c.net));const dv=[...dm.values()];
  const plan=rows.filter(r=>r.t.planFollowed===true||r.t.planFollowed===false);
  return {n,net:round2(sum(nets)),winRate:wins.length/n,wins:wins.length,losses:losses.length,be:n-wins.length-losses.length,
    avgWin:wins.length?gw/wins.length:null,avgLoss:losses.length?-gl/losses.length:null,
    pf:gl>0?gw/gl:(gw>0?Infinity:null),exp:sum(nets)/n,expR:Rs.length?avg(Rs):null,nR:Rs.length,
    best:Math.max(...nets),worst:Math.min(...nets),mdd:round2(mdd),ws,ls,
    greenDays:dv.filter(x=>x>0).length,redDays:dv.filter(x=>x<0).length,days:dv.length,
    planRate:plan.length?plan.filter(r=>r.t.planFollowed).length/plan.length:null,planN:plan.length};
}

/* ---------- Speichern ---------- */
let qSet=Promise.resolve();const qTrade=new Map();
function tradesCol(){return S.db.doc('data/users/'+S.uid+'/journal').collection('trades');}
function saveFail(e){const c=e&&e.code;
  S.saveErr=c==='quota_exceeded'?'Speicher voll: Neue Einträge können nicht angelegt werden. Exportiere ein Backup und lösche alte Trades.'
    :c==='invalid_argument'?'Speichern abgelehnt: Du hast in diesem Journal keine Schreibrechte.'
    :c==='revoked'?'Der Zugriff auf dieses Journal wurde beendet.'
    :'Speichern fehlgeschlagen. Prüf deine Verbindung und speichere den Eintrag erneut.';
  renderBanner();}
function persistSettings(next){
  if(S.demo){S.demo.settings=next;render();return;}
  S.real.settings=next;render();
  if(S.mode==='db'){const body=clone(next);const ref=S.db.doc('data/users/'+S.uid+'/settings');qSet=qSet.then(()=>ref.set(body)).catch(saveFail);}
  else lsSet('tj.settings',next);
}
function upsert(list,t){const i=list.findIndex(x=>x.id===t.id);if(i>=0)list[i]=t;else list.push(t);}
function persistTrade(t){
  if(S.demo){upsert(S.demo.trades,t);render();return Promise.resolve();}
  upsert(S.real.trades,t);render();
  if(S.mode==='db'){const ref=tradesCol().doc(t.id);const body=clone(t);
    const p=(qTrade.get(t.id)||Promise.resolve()).then(()=>ref.set(body)).catch(saveFail);qTrade.set(t.id,p);return p;}
  lsSet('tj.trades',S.real.trades);return Promise.resolve();
}
function deleteTrade(id){
  const list=S.demo?S.demo.trades:S.real.trades;const i=list.findIndex(x=>x.id===id);if(i>=0)list.splice(i,1);render();
  if(S.demo)return;
  if(S.mode==='db'){const ref=tradesCol().doc(id);const p=(qTrade.get(id)||Promise.resolve()).then(()=>ref.delete()).catch(saveFail);qTrade.set(id,p);}
  else lsSet('tj.trades',S.real.trades);
}

/* ---------- Rendering ---------- */
const ic=p=>`<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;

let logoN=0;
function logoState(){
  const acc=hasAcct()?activeAccount():null;if(!acc)return {p:0.75,tone:'ok',label:''};
  const A=acctStatus(acc);const pt=+acc.profitTarget||0;const p=pt>0?clamp(A.profit/pt,0,1):0;
  const tone=A.E.breach||A.used>=0.75?'bad':A.used>=0.5?'warn':'ok';
  return {p,tone,label:`Profit Target ${pct(p)} erreicht`};
}
function logoSVG(p,tone,id){
  const C=2*Math.PI*32;const g=tone==='bad'?['#FF453A','#FF2D55']:tone==='warn'?['#FFD60A','#FF9F0A']:['#30D158','#0A84FF'];
  const glow=tone==='bad'?'255,69,58':tone==='warn'?'255,214,10':'48,209,88';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><defs><linearGradient id="lb${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#26262c"/><stop offset="1" stop-color="#050507"/></linearGradient><linearGradient id="lr${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${g[0]}"/><stop offset="1" stop-color="${g[1]}"/></linearGradient></defs>`+
   `<rect width="120" height="120" rx="30" fill="url(#lb${id})"/><rect x=".75" y=".75" width="118.5" height="118.5" rx="29.3" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="1.5"/>`+
   `<circle cx="60" cy="60" r="32" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="9"/>`+
   (p>0.005?`<circle cx="60" cy="60" r="32" fill="none" stroke="url(#lr${id})" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(C*p).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 60 60)" style="filter:drop-shadow(0 0 5px rgba(${glow},.65))"/>`:'')+
   `<path d="M50 68 L60 56 L66 62 L74 52" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M68 51 h7 v7" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function acctCardHTML(acc,A){

  k.push(kpi('Bis zum Profit Target',A.remaining>0?money0(A.remaining):'erreicht',A.remaining<=0?'gain':'',A.remaining<=0?'':A.exp>0?`≈ ${Math.ceil(A.remaining/A.exp)} Trades bei aktueller Expectancy`:A.exp!=null?'Expectancy noch negativ':'Prognose nach den ersten Trades'));
  k.push(kpi('Heute',money(A.todayNet,true),A.todayNet>0?'gain':A.todayNet<0?'loss':'',limitSub));

  else if(lv===1)al.push(['lv1','Mehr als 30 % des Drawdowns verbraucht: Prüf deine letzten Verluste, bevor du weitermachst.']);
  if(pl>0&&lossToday>=pl)al.push(['bad','Persönliches Tageslimit erreicht. Heute keine weiteren Trades.']);

function equitySVG(A){
  const pts=A.E.curve;
  if(pts.length<2)return `<p class="empty">Sobald du Trades erfasst, siehst du hier deinen Kontostand im Verlauf, die Max-Loss-Grenze und das Profit Target.</p>`;
  const W=640,H=250,L=6,R=10,T=10,B=10;
  const ys=[...pts.map(p=>p.bal),...pts.map(p=>p.floor),A.target];
  let mn=Math.min(...ys),mx=Math.max(...ys);const py=(mx-mn)*0.08||50;mn-=py;mx+=py;
  const x=i=>L+(W-L-R)*i/(pts.length-1);const y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
  const bal=pts.map((p,i)=>x(i).toFixed(1)+','+y(p.bal).toFixed(1)).join(' ');
  let fl='M'+x(0).toFixed(1)+','+y(pts[0].floor).toFixed(1);
  for(let i=1;i<pts.length;i++)fl+=' L'+x(i).toFixed(1)+','+y(pts[i-1].floor).toFixed(1)+' L'+x(i).toFixed(1)+','+y(pts[i].floor).toFixed(1);
  const ns='vector-effect="non-scaling-stroke"';
  return `<svg class="eq" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Verlauf des Kontostands über ${pts.length-1} Trades mit Max-Loss-Grenze und Profit Target">
    <line class="eq-start" ${ns} x1="${L}" x2="${W-R}" y1="${y(A.size).toFixed(1)}" y2="${y(A.size).toFixed(1)}"/>
    <line class="eq-target" ${ns} x1="${L}" x2="${W-R}" y1="${y(A.target).toFixed(1)}" y2="${y(A.target).toFixed(1)}"/>
    <path class="eq-floor" ${ns} d="${fl}"/><polyline class="eq-bal" ${ns} points="${bal}"/></svg>
  <div class="eq-legend"><span><i class="lg"></i>Konto <span class="num">${money0(A.E.bal)}</span></span><span><i class="lg lg-floor"></i>Grenze <span class="num">${money0(A.E.floor)}</span></span><span><i class="lg lg-target"></i>Ziel <span class="num">${money0(A.target)}</span></span><span class="sub">Graue Linie: Start ${money0(A.size)}</span></div>`;
}

function ring(p,cls,label,val,sub){

    <div class="ring-c"><span class="ring-v">${val}</span><span class="ring-l">${label}</span></div></div>${sub?`<p class="tile-sub">${sub}</p>`:''}`;
}
function heroChart(A){

/* Auswertung */
/* ---------- Auswertung: Gruppen, Charts, Erkenntnisse ---------- */
const FAM={NQ:'NQ',MNQ:'NQ',ES:'ES',MES:'ES',GC:'GC',MGC:'GC',CL:'CL',MCL:'CL'};
const SL_BINS={NQ:[10,15,20,30],ES:[3,5,8,12],GC:[2,4,6,10],CL:[0.1,0.2,0.3,0.5]};
function slBucket(r){const f=FAM[r.t.instrument]||'NQ';const b=SL_BINS[f];const p=r.c.slPts;if(!(p>0))return null;
  const fm=x=>nf2.format(x);
  if(p<=b[0])return `${f} ≤${fm(b[0])} Pkt`;
  for(let i=1;i<b.length;i++)if(p<=b[i])return `${f} ${fm(b[i-1])}–${fm(b[i])} Pkt`;
  return `${f} >${fm(b[b.length-1])} Pkt`;}
function slOrder(){const o=[];for(const f of ['NQ','ES','GC','CL']){const b=SL_BINS[f];const fm=x=>nf2.format(x);o.push(`${f} ≤${fm(b[0])} Pkt`);for(let i=1;i<b.length;i++)o.push(`${f} ${fm(b[i-1])}–${fm(b[i])} Pkt`);o.push(`${f} >${fm(b[b.length-1])} Pkt`);}return o;}
const stabB=v=>v<=4?'1–4':v<=7?'5–7':'8–10';
const hourL=h=>pad(h)+'–'+pad((h+1)%24)+' Uhr';
const DIMS={
  session:{l:'Session',f:r=>[r.c.session],order:SESSION_ORDER},
  hour:{l:'Uhrzeit (Entry)',f:r=>r.c.hour!=null?[hourL(r.c.hour)]:[],order:[...Array(24)].map((_,i)=>hourL((i+22)%24))},
  weekday:{l:'Wochentag',f:r=>[WD[r.c.wd]],order:WD},
  instrument:{l:'Instrument',f:r=>[r.t.instrument],order:INSTR_LIST},
  dir:{l:'Richtung',f:r=>[r.t.dir===1?'Long':'Short'],order:['Long','Short']},
  setup:{l:'Setup',f:r=>[r.t.setup||'ohne Setup']},
  grade:{l:'Setup-Grade',f:r=>r.t.grade?[r.t.grade]:[],order:GRADES},
  emotion:{l:'Emotion',f:r=>r.t.emotions||[],order:EMOTIONS},
  confl:{l:'Confluence',f:r=>r.t.confluences||[]},
  conflN:{l:'Anzahl Confluences',f:r=>{const n=(r.t.confluences||[]).length;return [n>=4?'4+':String(n)];},order:['0','1','2','3','4+']},
  stab:{l:'Stabilität vorher',f:r=>r.t.stabBefore?[stabB(r.t.stabBefore)]:[],order:['1–4','5–7','8–10']},
  slSize:{l:'SL-Größe',f:r=>{const b=slBucket(r);return b?[b]:[];},order:null},
  slReason:{l:'Stop-Grund',f:r=>r.t.slReason?[r.t.slReason]:[],order:SL_REASONS},
  reaction:{l:'Reaktion am Level',f:r=>r.t.reaction?[r.t.reaction]:[],order:REACTIONS},
  be:{l:'Break-even',f:r=>r.t.beMoved==null?[]:[r.t.beMoved?'BE gezogen':'kein BE'],order:['BE gezogen','kein BE']},
  exitReason:{l:'Exit-Grund',f:r=>r.t.exitReason?[r.t.exitReason]:[],order:EXIT_REASONS},
  regime:{l:'Marktregime',f:r=>r.t.regime?[r.t.regime]:[],order:REGIMES},
  plan:{l:'Plan befolgt',f:r=>r.t.planFollowed==null?[]:[r.t.planFollowed?'Plan befolgt':'Plan gebrochen'],order:['Plan befolgt','Plan gebrochen']},
  error:{l:'Fehler',f:r=>r.t.errors||[],order:ERRORS}
};
DIMS.slSize.order=slOrder();
function agg(rs){const n=rs.length;if(!n)return {n:0};const nets=rs.map(r=>r.c.net);const Rs=rs.filter(r=>r.c.R!=null).map(r=>r.c.R);
  const gw=sum(nets.filter(x=>x>0)),gl=Math.abs(sum(nets.filter(x=>x<0)));
  return {n,wr:nets.filter(x=>x>0).length/n,avgR:Rs.length?avg(Rs):null,net:round2(sum(nets)),pf:gl>0?gw/gl:(gw>0?Infinity:null)};}
function groupBy(rows,key){const d=DIMS[key];const m=new Map();
  rows.forEach(r=>{for(const k of d.f(r)){if(!m.has(k))m.set(k,[]);m.get(k).push(r);}});
  let keys=[...m.keys()];
  if(d.order)keys.sort((a,b)=>{const ia=d.order.indexOf(a),ib=d.order.indexOf(b);return (ia<0?999:ia)-(ib<0?999:ib)||a.localeCompare(b);});
  else keys.sort((a,b)=>m.get(b).length-m.get(a).length);
  return keys.map(k=>({k,rows:m.get(k),...agg(m.get(k))}));}
const MIN_N=5;
const sgn=v=>v>0?'gain':v<0?'loss':'';

/* Balken: Win Rate (0–100 %, Linie bei 50 %) oder Ø R (divergierend) */
function bars(groups,metric){
  if(!groups.length)return '<p class="empty">Noch keine Daten für diesen Bereich.</p>';
  const maxR=Math.max(0.5,...groups.map(g=>Math.abs(g.avgR||0)));
  return `<div class="bars">${groups.map(g=>{const low=g.n<MIN_N;let bar;
    if(metric==='r'){const v=g.avgR||0;const w=Math.abs(v)/maxR*50;
      bar=`<div class="bt div"><i class="mid"></i><b class="${v>=0?'bg':'bl'}" style="${v>=0?'left:50%':'right:50%'};width:${w.toFixed(1)}%"></b></div>`;}
    else{const w=(g.wr||0)*100;bar=`<div class="bt"><i class="half"></i><b class="${g.wr>=0.5?'bg':'bl'}" style="left:0;width:${w.toFixed(1)}%"></b></div>`;}
    return `<div class="br${low?' low':''}"><div class="bl-l"><span>${esc(g.k)}</span><span class="sub">${g.n} ${g.n===1?'Trade':'Trades'}</span></div>${bar}
      <div class="bv"><strong class="${metric==='r'?sgn(g.avgR):''}">${metric==='r'?fmtR(g.avgR):pct(g.wr)}</strong><span class="sub">${metric==='r'?pct(g.wr)+' WR':fmtR(g.avgR)} · <span class="${sgn(g.net)}">${money0(g.net,true)}</span></span></div></div>`;}).join('')}</div>
    ${groups.some(g=>g.n<MIN_N)?`<p class="hint" style="margin-top:8px">Blasse Zeilen haben weniger als ${MIN_N} Trades und sind noch kein verlässliches Signal.</p>`:''}`;
}
/* Equity und Drawdown */
function eqDD(rows){
  if(rows.length<2)return '<p class="empty">Ab zwei Trades erscheint hier deine Equity-Kurve mit Drawdown.</p>';
  let cum=0,peak=0;const eq=[0],dd=[0];rows.forEach(r=>{cum+=r.c.net;peak=Math.max(peak,cum);eq.push(cum);dd.push(cum-peak);});

  const mdd=Math.min(...dd);let cur=dd[dd.length-1];

/* Heatmap Uhrzeit × Wochentag */
function heatmap(rows){
  const hrs=[...new Set(rows.map(r=>r.c.hour).filter(h=>h!=null))].sort((a,b)=>((a+2)%24)-((b+2)%24));
  if(!hrs.length)return '';

  const cell=new Map();rows.forEach(r=>{if(r.c.hour==null)return;const k=r.c.hour+'|'+r.c.wd;if(!cell.has(k))cell.set(k,[]);cell.get(k).push(r);});
  const mx=Math.max(0.3,...[...cell.values()].map(rs=>Math.abs(agg(rs).avgR||0)));
  return `<div class="tbl-wrap"><table class="heat"><thead><tr><th>Entry</th>${days.map(d=>`<th class="c">${WD[d]}</th>`).join('')}<th class="c">Gesamt</th></tr></thead><tbody>${hrs.map(h=>{
    const all=agg(rows.filter(r=>r.c.hour===h));
    return `<tr><td>${hourL(h)}</td>${days.map(d=>{const rs=cell.get(h+'|'+d);if(!rs)return '<td class="c e"></td>';const a=agg(rs);const v=a.avgR||0;
      const col=v>=0?'var(--gain)':'var(--loss)';const al=Math.round(10+50*Math.min(1,Math.abs(v)/mx));
      return `<td class="c" style="background:color-mix(in srgb,${col} ${al}%,var(--surface))" title="${a.n} Trades, Win Rate ${pct(a.wr)}, Ø ${fmtR(a.avgR)}"><strong>${pct(a.wr)}</strong><span class="sub">${a.n}×</span></td>`;}).join('')}
      <td class="c"><strong class="${sgn(all.avgR)}">${fmtR(all.avgR)}</strong><span class="sub">${all.n}×</span></td></tr>`;}).join('')}</tbody></table></div>
    <p class="hint" style="margin-top:8px">Zahl = Win Rate, darunter Anzahl Trades. Farbe = Ø R (grün positiv, rot negativ). Zeiten in deiner Ortszeit.</p>`;
}
/* R-Verteilung */

}

function beBlock(rows){

  const beOut=be.filter(r=>r.t.exitReason==='Break-even'||Math.abs(r.c.R||0)<0.1);
  const mins=be.map(r=>{const a=toMin(r.t.entryTime),b=toMin(r.t.beTime);if(a==null||b==null)return null;let d=b-a;if(d<0)d+=1440;return d;}).filter(v=>v!=null);
  const aB=agg(be),aN=agg(no);

    ${kpi('Ø R mit BE',fmtR(aB.avgR),sgn(aB.avgR),`ohne BE: ${fmtR(aN.avgR)}`)}

}

    if(w.avgR<0)out.push(['loss',`${label}, am schwächsten: <strong>${esc(w.k)}</strong> mit ${pct(w.wr)} Win Rate und ${fmtR(w.avgR)} pro Trade (${w.n} Trades).`]);};
  best('session','Session');best('hour','Uhrzeit');best('slSize','SL-Größe');best('confl','Confluence');best('slReason','Stop-Grund');best('reaction','Reaktion am Level');
  const em=groupBy(rows,'emotion').filter(g=>g.n>=3).sort((a,b)=>a.net-b.net)[0];

  if(er&&er.net<0)out.push(['loss',`Teuerster Fehler: <strong>${esc(er.k)}</strong> mit ${money0(er.net)} über ${er.n} Trades.`]);
  return out;
}

/* ---------- KI-Coach ---------- */
function md(s){
  const L=esc(s||'').split('\n');let o='',list=null;
  const inl=t=>t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  const close=()=>{if(list){o+=`</${list}>`;list=null;}};
  for(const raw of L){const l=raw.trim();
    if(!l){close();continue;}
    let m;
    if((m=l.match(/^#{1,4}\s+(.*)$/))){close();o+=`<h3>${inl(m[1])}</h3>`;continue;}
    if((m=l.match(/^[-*•]\s+(.*)$/))){if(list!=='ul'){close();o+='<ul>';list='ul';}o+=`<li>${inl(m[1])}</li>`;continue;}
    if((m=l.match(/^\d+[.)]\s+(.*)$/))){if(list!=='ol'){close();o+='<ol>';list='ol';}o+=`<li>${inl(m[1])}</li>`;continue;}
    close();o+=`<p>${inl(l)}</p>`;}
  close();return o;
}
function compactTrade(r){const t=r.t,c=r.c;

GRUPPEN (Sessions in deutscher Zeit: Pre-Asia 22–01, Asia 01–08, London 08–14:30, Pre-NY 14:30–15:30, NY Open 15:30–17, NY Midday 17–20, NY Close 20–22):

const COACH_SYS=`Du bist ein strenger, objektiver Trading-Coach für einen Futures-Daytrader (NQ, ES, GC, CL) in einer Prop-Firm-Evaluation. Er handelt Orderflow: Absorption, Key Levels, Volume Profile, Key Times.
Regeln:
- Urteile nur aus den Daten. Keine Schmeicheleien, kein Motivationsgerede.
- Nenne bei jeder Aussage die Zahl und die Stichprobe (n). Gruppen unter 5 Trades sind kein Signal: sag das ausdrücklich, statt Schlüsse zu ziehen.
- Bewerte Prozess vor Ergebnis: Ein Verlust mit befolgtem Plan ist besser als ein Gewinn mit gebrochenem Plan.
- Schreib auf Deutsch, englische Fachbegriffe beibehalten. Kurze Absätze und Aufzählungen, Überschriften mit ##.`;
async function runCoach(kind){
  if(!S.sample||S.coach.busy)return;
  const acc=activeAccount();const all=enrich(acctTrades(acc));
  let rows=all;if(kind==='week'){const d=new Date();d.setDate(d.getDate()-7);const c=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());rows=all.filter(r=>r.t.date>=c);}
  if(!rows.length){S.coach.err=kind==='week'?'In den letzten 7 Tagen gibt es keine Trades.':'Noch keine Trades zum Auswerten.';render();return;}
  const q=(S.coach.q||'').trim();
  if(kind==='q'&&!q){S.coach.err='Schreib zuerst deine Frage.';render();return;}
  const task=kind==='q'?`Beantworte diese Frage anhand der Daten: "${q}". Prüfe sie wie eine Hypothese: Was stützt sie, was spricht dagegen, wie sicher ist die Aussage bei dieser Stichprobe?`
    :`Erstelle eine ${kind==='week'?'Wochenanalyse der letzten 7 Tage':'Gesamtanalyse'} mit diesen Abschnitten:
## Kurzfazit (3 Sätze)
## Was funktioniert (mit Zahlen)
## Was dich Geld kostet
## Uhrzeiten und Sessions (Ab welcher Uhrzeit lohnt sich Traden? Wie schneiden Pre-Asia und Asia ab?)
## Stop-Loss, RR und Break-even (Welche SL-Größe und welcher Stop-Grund funktionieren? Lohnt der Break-even, und wann?)
## Psychologie (Emotionen, Stabilität vor dem Entry, Verhalten nach Verlusten)
## 3 konkrete Regeln für die nächsten Tage
## Noch nicht belastbar (was mehr Daten braucht)`;
  S.coach={...S.coach,busy:true,err:'',text:'',kind,at:null};render();
  const ctrl=new AbortController();S.coachCtrl=ctrl;
  try{
    const r=await S.sample([{role:'user',content:COACH_SYS+'\n\n'+task+'\n\nDATEN:\n'+coachData(rows,acc)}],{modelTier:'complex',cache:false,signal:ctrl.signal,
      onText:({text})=>{S.coach.text=text;const o=$('#coachOut');if(o)o.innerHTML=md(text);}});
    S.coach.text=r.text;S.coach.at=Date.now();S.coach.acct=acc.id;S.coach.n=rows.length;saveCoach();
  }catch(e){const c=e&&e.code;if(e&&e.text)S.coach.text=e.text;
    if(c==='not_granted'){S.coachDenied=true;S.coach.err='Du hast den KI-Zugriff für diese Seite abgelehnt. Über das Berechtigungsmenü der Seite kannst du ihn wieder erlauben.';}
    else if(c==='aborted'||(e&&e.name==='AbortError'))S.coach.err='Analyse abgebrochen.';
    else if(c==='rate_limited')S.coach.err='Zu viele Anfragen. Versuch es in ein paar Minuten noch einmal.';
    else if(c==='not_setup')S.coach.err='Der KI-Coach ist noch nicht eingerichtet: In Supabase fehlt die Edge Function „coach“.';
    else if(c==='no_key')S.coach.err='In Supabase fehlt das Secret ANTHROPIC_API_KEY für den KI-Coach.';
    else S.coach.err='Die Analyse hat nicht geklappt. Versuch es noch einmal.';}
  S.coach.busy=false;S.coachCtrl=null;render({bg:true});
}

const DEMO_COACH="## Kurzfazit\nDu liegst mit 32 Trades bei +1.172 $, Win Rate 50 %, Profit Factor 1,9 und +0,27 R pro Trade. Dir fehlen nur noch 79 $ bis zum Profit Target, dein Puffer ist mit 1.000 $ voll. Der größte Hebel ist nicht dein Entry, sondern was du nach dem Entry machst: Break-even und schwache Reaktionen am Level kosten dich messbar Geld.\n\n## Was funktioniert\n- **Starke Reaktion am Level:** 13 Trades, 100 % Win Rate, +1,11 R, +1.901 $. Das ist dein klarstes Signal im ganzen Journal.\n- **NQ/MNQ mit 15–20 Punkten Stop:** 7 Trades, 86 % Win Rate, +0,91 R.\n- **Ruhig oder fokussiert:** 15 bzw. 11 Trades mit über 90 % Win Rate und rund +1,1 R.\n- **Stop am Key Level:** 7 Trades, +0,58 R, besser als Swing High/Low mit +0,09 R (n=9).\n- **Exit am Target:** 10 Trades, +1,29 R. Wenn du den Plan durchziehst, zahlt er sich aus.\n\n## Was dich Geld kostet\n- **Reaktion „durchgebrochen“ oder „keine“:** zusammen 12 Trades, 0 % Win Rate, −964 $. Du bist in Level eingestiegen, die nicht gehalten haben.\n- **Setup „Liquidity Sweep + Reclaim“:** 9 Trades, 11 % Win Rate, −0,40 R, −468 $. Dein schwächstes Setup.\n- **NQ mit Stop unter 10 Punkten:** 8 Trades, 25 % Win Rate, −0,23 R. Zu enge Stops werden ausgerauscht.\n- **Angst und Ungeduld:** 11 Trades, 0 % Win Rate, −1.076 $.\n\n## Uhrzeiten und Sessions\n- **09–10 Uhr** ist deine beste Stunde: 5 Trades, 80 % Win Rate, +0,91 R.\n- **Ab 10 Uhr fällt es ab:** 10–11 Uhr −0,01 R (n=3), 11–12 Uhr −0,89 R (n=2).\n- **NY Open** hat die meisten Trades (13), aber nur 38 % Win Rate und +0,20 R.\n- **Asia** sieht gut aus (4 Trades, 75 %, +0,71 R), **Pre-Asia** liegt bei +0,06 R (n=3). Beide Gruppen sind unter 5 Trades. Die These „Pre-Asia und Asia sind am besten“ ist damit **noch nicht bestätigt**, nur nicht widerlegt.\n\n## Stop-Loss, RR und Break-even\n- **Ø Stop bei NQ/MNQ: 14,2 Punkte**, Median 15,6. Deine besten Ergebnisse liegen aber bei 15–20 Punkten. Dein Durchschnitt ist eher zu eng.\n- **Break-even schadet dir aktuell:** mit BE 36 % Win Rate und +0,11 R (n=14), ohne BE 61 % und +0,40 R (n=18). 5 Trades wurden am BE ausgestoppt, meist 3–7 Minuten nach dem Entry. Du ziehst den Stop zu früh.\n- Geplantes RR liegt bei etwa 1 : 2, deine Gewinner bringen im Schnitt +1,2 R. Du nimmst einen guten Teil deines Ziels mit.\n\n## Psychologie\n- Stabilität 8–10: +0,88 R (n=7). Das stützt die Idee, nur bei hoher Stabilität zu handeln.\n- Auffällig: 5–7 liegt mit −0,10 R (n=16) schlechter als 1–4 mit +0,46 R (n=9). Das ist unlogisch und spricht eher für Rauschen oder ungenaue Selbsteinschätzung. Bewerte die Stabilität ehrlicher, bevor du daraus eine Regel machst.\n- Plan gebrochen: 6 Trades, −0,12 R. Plan befolgt: 26 Trades, +0,36 R.\n\n## 3 konkrete Regeln für die nächsten Tage\n1. **Kein Entry ohne starke Reaktion am Level.** Bei „keine“ oder „schwach“ aussetzen.\n2. **Break-even frühestens nach +1 R** oder 15 Minuten, nicht nach 3–7 Minuten.\n3. **NQ-Stop mindestens 15 Punkte**, Positionsgröße dafür über MNQ anpassen. „Liquidity Sweep + Reclaim“ pausieren, bis du es neu definiert hast.\n\n## Noch nicht belastbar\n- Pre-Asia, Asia, alle Stunden außer 09–10 und 15–17 Uhr\n- MGC, ES-SL-Gruppen, Setup-Grade A+ und C\n- Einzelne Fehler-Tags (je 1–2 Trades)\nAb etwa 30 Trades pro Gruppe werden diese Aussagen verlässlich.";

function readAcctForm(base){
  const form=$('[data-form="acct"]');const a=clone(base);a.funded=a.funded||{};const E={};
  $$('[data-af]',form).forEach(el=>{const k=el.dataset.af;const isNum=NUM_KEYS.has(k);const v=isNum?parseNum(el.value):el.value.trim();
    if(k.startsWith('funded.'))a.funded[k.slice(7)]=v;else a[k]=v;});
  if(!a.name)E.name='Gib dem Konto einen Namen.';
  for(const k of ['size','maxLoss','startBalance'])if(!(a[k]>0))E[k]='Zahl größer 0.';
  for(const k of ['profitTarget','dailyLossLimit','personalDailyLimit','maxMinis','minDays','consistencyPct','priorDays']){if(a[k]==null)a[k]=0;if(!isFinite(a[k])||a[k]<0)E[k]='Zahl ab 0.';}
  if(!E.minDays&&!Number.isInteger(a.minDays))E.minDays='Ganze Zahl.';
  if(!E.priorDays&&!Number.isInteger(a.priorDays))E.priorDays='Ganze Zahl.';
  if(!E.consistencyPct&&a.consistencyPct>100)E.consistencyPct='Höchstens 100.';
  if(a.lockAt!=null&&(!isFinite(a.lockAt)||a.lockAt<=0))E.lockAt='Leer lassen oder Zahl größer 0.';
  if(a.cost!=null&&(!isFinite(a.cost)||a.cost<0))E.cost='Zahl ab 0.';
  if(a.startFloor==null||!isFinite(a.startFloor))E.startFloor='Trag die aktuelle Grenze ein.';
  else if(a.startBalance>0&&a.startFloor>=a.startBalance)E.startFloor='Die Grenze muss unter dem Kontostand liegen.';
  const fc=a.funded.consistencyPct;if(fc!=null&&(!isFinite(fc)||fc<0||fc>100))E['funded.consistencyPct']='Zahl zwischen 0 und 100.';
  return {a,E};
}

function autoComm(updateDom){
  if(!F||F.commManual)return;const st=settings();const c=parseNum(F.contracts);const ins=INSTR[F.instrument];
  const per=ins&&ins.mini===1?+((st.commissions&&st.commissions.mini)||0):+((st.commissions&&st.commissions.micro)||0);
  if(per>0&&c>0){F.commission=numStr(round2(c*per));if(updateDom){const el=$('[data-f="commission"]',$('#sheet'));if(el)el.value=F.commission;}}
}
function syncSingleExit(){
  if(F.exits.length===1&&!F.exitQtyManual){F.exits[0].qty=F.contracts;const q=$('[data-ex="0"][data-exk="qty"]',$('#sheet'));if(q)q.value=F.contracts;}
}
function updateLive(){
  const box=$('#live');if(!box||!F)return;const acc=activeAccount();const A=acctStatus(acc);const ins=INSTR[F.instrument];
  const c=parseNum(F.contracts),en=parseNum(F.entry),sp=parseNum(F.stop),tg=parseNum(F.target),cm=parseNum(F.commission)||0;
  const ex=F.exits.map(e=>({price:parseNum(e.price),qty:parseNum(e.qty)})).filter(e=>e.price!=null&&isFinite(e.price)&&e.qty>0);
  const ok=c>0&&en!=null&&isFinite(en);
  const risk=(ok&&sp!=null&&isFinite(sp)&&sp!==en)?round2(Math.abs(en-sp)*ins.pv*c):null;
  const pR=(risk&&tg!=null&&isFinite(tg))?Math.abs(tg-en)/Math.abs(en-sp):null;
  let net=null,R=null;
  if(ok&&ex.length&&sum(ex.map(e=>e.qty))===c){net=round2(sum(ex.map(e=>(e.price-en)*F.dir*ins.pv*e.qty))-(isFinite(cm)?cm:0));if(risk>0)R=net/risk;}
  const mini=c>0?ins.mini*c:null;const buffer=A.buffer;const w=[];
  if(mini!=null&&+acc.maxMinis>0&&mini>+acc.maxMinis+1e-9)w.push(`Mehr Kontrakte als erlaubt: max. ${fmtN(+acc.maxMinis)} Minis bzw. ${fmtN(+acc.maxMinis*10)} Micros.`);
  if(ok&&sp!=null&&isFinite(sp)&&((F.dir===1&&sp>=en)||(F.dir===-1&&sp<=en)))w.push(F.dir===1?'Bei Long liegt der Stop unter dem Entry.':'Bei Short liegt der Stop über dem Entry.');
  else if(risk&&buffer>0&&risk>=buffer)w.push('Das Risiko ist größer als dein Puffer bis zur Grenze.');
  else if(risk&&buffer>0&&risk/buffer>0.5)w.push('Dieser Trade riskiert mehr als die Hälfte deines Puffers.');
  const tk=ins.tick;const off=v=>v!=null&&isFinite(v)&&Math.abs(v/tk-Math.round(v/tk))>1e-6;
  if([en,sp,tg,...ex.map(e=>e.price)].some(off))w.push(`Mindestens ein Preis passt nicht zur Tick-Größe ${nf2.format(tk)} von ${F.instrument}.`);
  box.innerHTML=`<div><div class="fl">Risiko (1R)</div><div class="lv">${risk!=null?money(risk):'–'}</div><div class="sub">${risk?nf2.format(Math.abs(en-sp))+' Pkt · ':''}${risk&&+acc.maxLoss?pct(risk/acc.maxLoss)+' vom Max Loss':''}</div></div>
    <div><div class="fl">Geplantes R</div><div class="lv">${pR!=null?nf1.format(pR)+' R':'–'}</div><div class="sub">${risk&&buffer>0?pct(risk/buffer)+' deines Puffers':''}</div></div>
    <div><div class="fl">Ergebnis netto</div><div class="lv ${net>0?'gain':net<0?'loss':''}">${net!=null?money(net,true):'–'}</div><div class="sub">${R!=null?fmtR(R):''}</div></div>
    <div><div class="fl">Größe</div><div class="lv">${mini!=null?fmtN(mini)+' Mini':'–'}</div><div class="sub">erlaubt: ${fmtN(+acc.maxMinis)} Minis</div></div>
    ${w.length?`<div class="live-warn">${w.map(x=>`<p>${esc(x)}</p>`).join('')}</div>`:''}`;
}

function validateSheet(){
  const E={};const c=parseNum(F.contracts),en=parseNum(F.entry),sp=parseNum(F.stop),tg=parseNum(F.target),cm=parseNum(F.commission),mae=parseNum(F.mae),mfe=parseNum(F.mfe);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(F.date||''))E.date='Datum fehlt.';
  if(!/^\d{2}:\d{2}$/.test(F.entryTime||''))E.entryTime='Entry-Zeit fehlt.';
  if(F.exitTime&&!/^\d{2}:\d{2}$/.test(F.exitTime))E.exitTime='Zeit im Format HH:MM.';
  if(F.beTime&&!/^\d{2}:\d{2}$/.test(F.beTime))E.beTime='Zeit im Format HH:MM.';
  if(!(c>0)||!Number.isInteger(c))E.contracts='Ganze Zahl ab 1.';
  if(en==null||!isFinite(en)||en<=0)E.entry='Entry-Preis fehlt.';
  if(sp==null||!isFinite(sp)||sp<=0)E.stop='Stop fehlt. Ohne Stop gibt es kein R-Multiple.';
  else if(en!=null&&isFinite(en)&&((F.dir===1&&sp>=en)||(F.dir===-1&&sp<=en)))E.stop=F.dir===1?'Bei Long liegt der Stop unter dem Entry.':'Bei Short liegt der Stop über dem Entry.';
  if(tg!=null&&!isFinite(tg))E.target='Keine gültige Zahl.';
  const ex=F.exits.map(e=>({price:parseNum(e.price),qty:parseNum(e.qty)}));
  if(ex.some(e=>e.price==null||!isFinite(e.price)||e.price<=0))E.exits='Jeder Exit braucht einen Preis.';
  else if(ex.some(e=>!(e.qty>0)||!Number.isInteger(e.qty)))E.exits='Kontrakte pro Exit als ganze Zahl angeben.';
  else if(c>0&&sum(ex.map(e=>e.qty))!==c)E.exits=`Die Exits ergeben ${sum(ex.map(e=>e.qty))} Kontrakte, der Trade hat ${c}.`;
  if(cm!=null&&(!isFinite(cm)||cm<0))E.commission='Keine gültige Zahl.';
  if(mae!=null&&!isFinite(mae))E.mae='Keine gültige Zahl.';
  if(mfe!=null&&!isFinite(mfe))E.mfe='Keine gültige Zahl.';
  if(!(F.stabBefore>=1))E.stabBefore='Trag ein, wie stabil du vor dem Entry warst.';
  return {E,v:{c,en,sp,tg,cm,mae,mfe,ex}};
}
